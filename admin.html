<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZYRE Marketing Admin</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 900px;
      margin: auto;
    }

    h1 {
      text-align: center;
    }

    .card {
      background: white;
      padding: 20px;
      margin-top: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .seller {
      border-bottom: 1px solid #ddd;
      padding: 18px 0;
    }

    .seller:last-child {
      border-bottom: none;
    }

    button {
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 10px;
      margin-right: 8px;
    }

    .approve {
      background: black;
      color: white;
    }

    .reject {
      background: #ddd;
      color: black;
    }

    .status {
      font-weight: bold;
    }

    #sellerList {
      min-height: 50px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>🛡️ ZavaMarket Admin Dashboard</h1>

  <div class="card">

    <h2>Seller Applications</h2>

    <div id="sellerList">
      Loading seller applications...
    </div>

  </div>

</div>

<script>

const SUPABASE_URL =
"https://gaccizzlwswwynattgda.supabase.co";

const SUPABASE_KEY =
"sb_publishable_902JguVx0M5DNLWVx8trpA_LUlUMDG0";


async function loadSellers() {

  const sellerList =
    document.getElementById("sellerList");

  sellerList.innerHTML =
    "Loading seller applications...";

  try {

    const url =
      SUPABASE_URL +
      "/rest/v1/sellers?select=*&order=id.desc";

    const response = await fetch(url, {

      method: "GET",

      headers: {
        "apikey": SUPABASE_KEY,
        "Authorization": "Bearer " + SUPABASE_KEY,
        "Content-Type": "application/json"
      }

    });

    const text = await response.text();

    console.log("Supabase response:", text);

    if (!response.ok) {

      sellerList.innerHTML =
        "<p>Supabase error:</p>" +
        "<pre>" +
        text +
        "</pre>";

      return;
    }

    const sellers = JSON.parse(text);

    if (!Array.isArray(sellers)) {

      sellerList.innerHTML =
        "<pre>" +
        JSON.stringify(sellers, null, 2) +
        "</pre>";

      return;
    }

    if (sellers.length === 0) {

      sellerList.innerHTML =
        "<p>No seller applications found.</p>";

      return;
    }

    sellerList.innerHTML = "";

    sellers.forEach(function(seller) {

      const div =
        document.createElement("div");

      div.className = "seller";

      const status =
        seller.approved
          ? "✅ Approved"
          : "⏳ Pending";

      div.innerHTML = `

        <h3>
          🏪 ${seller.store_name || "Unnamed Store"}
        </h3>

        <p>
          <strong>Email:</strong>
          ${seller.email || "No email"}
        </p>

        <p>
          <strong>Description:</strong>
          ${seller.description || "No description"}
        </p>

        <p class="status">
          <strong>Status:</strong>
          ${status}
        </p>

        ${
          seller.approved
          ? ""
          : `
            <button
              class="approve"
              onclick="approveSeller(${seller.id})"
            >
              ✅ Approve Seller
            </button>

            <button
              class="reject"
              onclick="rejectSeller(${seller.id})"
            >
              ❌ Reject
            </button>
          `
        }

      `;

      sellerList.appendChild(div);

    });

  } catch (error) {

    sellerList.innerHTML =
      "<p>JavaScript error:</p>" +
      "<pre>" +
      error.message +
      "</pre>";

  }
}


async function approveSeller(id) {

  if (!confirm("Approve this seller?")) {
    return;
  }

  try {

    const response = await fetch(

      SUPABASE_URL +
      "/rest/v1/sellers?id=eq." + id,

      {
        method: "PATCH",

        headers: {

          "apikey": SUPABASE_KEY,

          "Authorization":
            "Bearer " + SUPABASE_KEY,

          "Content-Type":
            "application/json",

          "Prefer":
            "return=minimal"

        },

        body: JSON.stringify({
          approved: true
        })

      }

    );

    const text =
      await response.text();

    if (!response.ok) {

      alert(
        "Seller could not be approved:\n\n" +
        text
      );

      return;
    }

    alert(
      "Seller approved successfully! 🎉"
    );

    loadSellers();

  } catch (error) {

    alert(
      "Error:\n\n" +
      error.message
    );

  }
}


async function rejectSeller(id) {

  if (!confirm("Reject this seller application?")) {
    return;
  }

  try {

    const response = await fetch(

      SUPABASE_URL +
      "/rest/v1/sellers?id=eq." + id,

      {
        method: "PATCH",

        headers: {

          "apikey": SUPABASE_KEY,

          "Authorization":
            "Bearer " + SUPABASE_KEY,

          "Content-Type":
            "application/json",

          "Prefer":
            "return=minimal"

        },

        body: JSON.stringify({
          approved: false
        })

      }

    );

    const text =
      await response.text();

    if (!response.ok) {

      alert(
        "Seller could not be rejected:\n\n" +
        text
      );

      return;
    }

    alert(
      "Seller application rejected."
    );

    loadSellers();

  } catch (error) {

    alert(
      "Error:\n\n" +
      error.message
    );

  }
}


loadSellers();

</script>

</body>
</html>
