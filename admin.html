<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZYRE Marketing Admin</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 900px;
      margin: auto;
    }

    h1 {
      text-align: center;
    }

    .card {
      background: white;
      padding: 20px;
      margin-top: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .seller {
      border-bottom: 1px solid #ddd;
      padding: 18px 0;
    }

    .seller:last-child {
      border-bottom: none;
    }

    button {
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 10px;
      margin-right: 8px;
    }

    .approve {
      background: black;
      color: white;
    }

    .reject {
      background: #ddd;
      color: black;
    }

    .logout {
      background: #b00020;
      color: white;
    }

    .status {
      font-weight: bold;
    }

    #sellerList {
      min-height: 50px;
    }

    #loginBox {
      text-align: center;
    }

    input {
      width: 100%;
      max-width: 400px;
      padding: 12px;
      margin: 8px 0;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    .loginButton {
      background: black;
      color: white;
    }

    .hidden {
      display: none;
    }

    .error {
      color: #b00020;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>🛡️ ZYRE Marketing Admin</h1>

  <div id="loginBox" class="card">

    <h2>Admin Login</h2>

    <p>Sign in with your ZYRE Marketing admin account.</p>

    <input
      type="email"
      id="email"
      placeholder="Admin email"
    >

    <input
      type="password"
      id="password"
      placeholder="Password"
    >

    <br>

    <button
      class="loginButton"
      onclick="loginAdmin()"
    >
      🔐 Login
    </button>

    <p id="loginMessage"></p>

  </div>


  <div id="adminPanel" class="hidden">

    <div class="card">

      <h2>Seller Applications</h2>

      <button
        class="logout"
        onclick="logoutAdmin()"
      >
        Logout
      </button>

      <div id="sellerList">
        Loading seller applications...
      </div>

    </div>

  </div>

</div>


<script>

const SUPABASE_URL =
"https://gaccizzlwswwynattgda.supabase.co";

const SUPABASE_KEY =
"sb_publishable_902JguVx0M5DNLWVx8trpA_LUlUMDG0";


let accessToken = null;


/* =========================
   LOGIN
========================= */

async function loginAdmin() {

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  const message =
    document.getElementById("loginMessage");

  if (!email || !password) {

    message.innerHTML =
      '<span class="error">Enter your email and password.</span>';

    return;
  }

  message.textContent = "Signing in...";

  try {

    const response = await fetch(
      SUPABASE_URL +
      "/auth/v1/token?grant_type=password",
      {
        method: "POST",

        headers: {
          "apikey": SUPABASE_KEY,
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          email: email,
          password: password
        })
      }
    );

    const data = await response.json();

    if (!response.ok) {

      message.innerHTML =
        '<span class="error">' +
        (data.error_description ||
         data.message ||
         "Login failed.") +
        "</span>";

      return;
    }

    accessToken = data.access_token;

    const userId = data.user.id;

    /* Check profile role */

    const profileResponse = await fetch(
      SUPABASE_URL +
      "/rest/v1/profiles?id=eq." +
      encodeURIComponent(userId) +
      "&select=role",
      {
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization":
            "Bearer " + accessToken
        }
      }
    );

    const profiles =
      await profileResponse.json();

    if (!profileResponse.ok) {

      message.innerHTML =
        '<span class="error">' +
        "Could not check admin role." +
        "</span>";

      accessToken = null;

      return;
    }

    if (
      !profiles.length ||
      profiles[0].role !== "admin"
    ) {

      message.innerHTML =
        '<span class="error">' +
        "Access denied. This account is not an admin." +
        "</span>";

      accessToken = null;

      return;
    }

    /* Admin confirmed */

    document.getElementById("loginBox")
      .classList.add("hidden");

    document.getElementById("adminPanel")
      .classList.remove("hidden");

    loadSellers();

  } catch (error) {

    message.innerHTML =
      '<span class="error">' +
      error.message +
      "</span>";

  }
}


/* =========================
   LOAD SELLERS
========================= */

async function loadSellers() {

  const sellerList =
    document.getElementById("sellerList");

  sellerList.innerHTML =
    "Loading seller applications...";

  try {

    const response = await fetch(

      SUPABASE_URL +
      "/rest/v1/sellers?select=*&order=id.desc",

      {
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization":
            "Bearer " + accessToken
        }
      }

    );

    const text =
      await response.text();

    if (!response.ok) {

      sellerList.innerHTML =
        "<p>Supabase error:</p>" +
        "<pre>" +
        text +
        "</pre>";

      return;
    }

    const sellers =
      JSON.parse(text);

    if (!sellers.length) {

      sellerList.innerHTML =
        "<p>No seller applications found.</p>";

      return;
    }

    sellerList.innerHTML = "";

    sellers.forEach(function(seller) {

      const div =
        document.createElement("div");

      div.className = "seller";

      div.innerHTML = `

        <h3>
          🏪 ${seller.store_name || "Unnamed Store"}
        </h3>

        <p>
          <strong>Email:</strong>
          ${seller.email || "No email"}
        </p>

        <p>
          <strong>Description:</strong>
          ${seller.description || "No description"}
        </p>

        <p class="status">
          <strong>Status:</strong>
          ${
            seller.approved
            ? "✅ Approved"
            : "⏳ Pending"
          }
        </p>

        ${
          seller.approved
          ? ""
          : `
            <button
              class="approve"
              onclick="approveSeller(${seller.id})"
            >
              ✅ Approve Seller
            </button>

            <button
              class="reject"
              onclick="rejectSeller(${seller.id})"
            >
              ❌ Reject
            </button>
          `
        }

      `;

      sellerList.appendChild(div);

    });

  } catch (error) {

    sellerList.innerHTML =
      "<p>Error:</p><pre>" +
      error.message +
      "</pre>";

  }
}


/* =========================
   APPROVE SELLER
========================= */

async function approveSeller(id) {

  if (!confirm("Approve this seller?")) {
    return;
  }

  try {

    const response = await fetch(

      SUPABASE_URL +
      "/rest/v1/sellers?id=eq." + id,

      {
        method: "PATCH",

        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization":
            "Bearer " + accessToken,
          "Content-Type":
            "application/json",
          "Prefer":
            "return=minimal"
        },

        body: JSON.stringify({
          approved: true
        })
      }

    );

    const text =
      await response.text();

    if (!response.ok) {

      alert(
        "Seller could not be approved:\n\n" +
        text
      );

      return;
    }

    alert(
      "Seller approved successfully! 🎉"
    );

    loadSellers();

  } catch (error) {

    alert(
      "Error:\n\n" +
      error.message
    );

  }
}


/* =========================
   REJECT SELLER
========================= */

async function rejectSeller(id) {

  if (!confirm("Reject this seller application?")) {
    return;
  }

  try {

    const response = await fetch(

      SUPABASE_URL +
      "/rest/v1/sellers?id=eq." + id,

      {
        method: "PATCH",

        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization":
            "Bearer " + accessToken,
          "Content-Type":
            "application/json",
          "Prefer":
            "return=minimal"
        },

        body: JSON.stringify({
          approved: false
        })
      }

    );

    const text =
      await response.text();

    if (!response.ok) {

      alert(
        "Seller could not be rejected:\n\n" +
        text
      );

      return;
    }

    alert(
      "Seller application rejected."
    );

    loadSellers();

  } catch (error) {

    alert(
      "Error:\n\n" +
      error.message
    );

  }
}


/* =========================
   LOGOUT
========================= */

function logoutAdmin() {

  accessToken = null;

  document.getElementById("adminPanel")
    .classList.add("hidden");

  document.getElementById("loginBox")
    .classList.remove("hidden");

  document.getElementById("email").value = "";
  document.getElementById("password").value = "";

  document.getElementById("loginMessage")
    .textContent = "";
}

</script>

</body>
</html>
