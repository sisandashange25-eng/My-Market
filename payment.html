  </div><script>

const SUPABASE_URL =
  "https://gaccizzlwswwynattgda.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_902JguVx0M5DNLWVx8trpA_LUlUMDG0";


/* =========================
   SUPABASE CLIENT
========================= */

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY,
    {
      auth: {
        persistSession: true,
        autoRefreshToken: true,
        detectSessionInUrl: true
      }
    }
  );


const statusBox =
  document.getElementById("statusBox");


const paymentDetails =
  document.getElementById("paymentDetails");


/* =========================
   DISPLAY HELPERS
========================= */

function showError(message) {

  statusBox.className =
    "status error";

  statusBox.innerHTML =
    message;
}


function showSuccess(message) {

  statusBox.className =
    "status success";

  statusBox.innerHTML =
    message;
}


/* =========================
   GET CUSTOMER SESSION
========================= */

async function getCustomerSession() {

  const {
    data,
    error
  } =
    await supabaseClient.auth.getSession();


  if (
    !error &&
    data &&
    data.session
  ) {

    return data.session;

  }


  if (
    window.ZYRE_CURRENT_SESSION &&
    window.ZYRE_CURRENT_SESSION.access_token
  ) {

    return window.ZYRE_CURRENT_SESSION;

  }


  return null;

}


/* =========================
   VERIFY PAYMENT
========================= */

async function verifyPayment() {

  try {

    /* =========================
       READ PAYSTACK CALLBACK
    ========================= */

    const params =
      new URLSearchParams(
        window.location.search
      );


    const orderId =
      params.get("order_id");


    const reference =
      params.get("reference") ||
      params.get("trxref");


    if (!orderId) {

      showError(
        "No order number was supplied."
      );

      return;

    }


    if (!reference) {

      showError(
        "No Paystack payment reference was supplied."
      );

      return;

    }


    /* =========================
       GET CUSTOMER SESSION
    ========================= */

    const session =
      await getCustomerSession();


    if (!session) {

      showError(
        "Your customer login session could not be found. " +
        "Please return to the marketplace, log in again, and retry payment."
      );

      return;

    }


    /* =========================
       MAKE SURE SESSION IS SET
       IN SUPABASE CLIENT
    ========================= */

    await supabaseClient.auth.setSession({

      access_token:
        session.access_token,

      refresh_token:
        session.refresh_token || ""

    });


    /* =========================
       CALL EDGE FUNCTION
    ========================= */

    const {
      data: result,
      error: functionError
    } =
      await supabaseClient.functions.invoke(
        "paystack-verify",
        {
          body: {

            order_id:
              orderId,

            reference:
              reference

          }
        }
      );


    /* =========================
       EDGE FUNCTION ERROR
    ========================= */

    if (functionError) {

      console.error(
        "PAYSTACK VERIFY FUNCTION ERROR:",
        functionError
      );


      let message =
        functionError.message ||
        "Payment verification failed.";


      /*
        Try to read the actual
        Edge Function response.
      */

      try {

        if (
          functionError.context &&
          typeof functionError.context.json === "function"
        ) {

          const errorBody =
            await functionError.context.json();

          if (
            errorBody &&
            errorBody.error
          ) {

            message =
              errorBody.error;

            if (
              errorBody.details
            ) {

              message +=
                " — " +
                errorBody.details;

            }

          }

        }

      } catch (readError) {

        console.error(
          "Could not read function error:",
          readError
        );

      }


      throw new Error(message);

    }


    /* =========================
       CHECK RESULT
    ========================= */

    if (
      !result ||
      !result.success
    ) {

      throw new Error(

        result &&
        result.error

          ? result.error

          : "Payment verification failed."

      );

    }


    /* =========================
       SUCCESS
    ========================= */

    const amount =
      Number(result.amount);


    const commission =
      amount * 0.10;


    const sellerAmount =
      amount * 0.90;


    showSuccess(
      "Payment successful! Your order has been marked as Paid."
    );


    paymentDetails.innerHTML = `

      <div class="card">

        <div class="row">

          <span class="label">
            Order Number
          </span>

          <span class="value">
            #${result.order_id}
          </span>

        </div>


        <div class="row">

          <span class="label">
            Amount
          </span>

          <span class="value">
            R${amount.toFixed(2)}
          </span>

        </div>


        <div class="row">

          <span class="label">
            Payment Status
          </span>

          <span class="value">
            Paid
          </span>

        </div>

      </div>


      <div class="breakdown-title">
        Payment Breakdown
      </div>


      <div class="card">

        <div class="row">

          <span class="label">
            ZYRE Marketing Commission (10%)
          </span>

          <span class="value">
            R${commission.toFixed(2)}
          </span>

        </div>


        <div class="row">

          <span class="label">
            Seller Amount (90%)
          </span>

          <span class="value">
            R${sellerAmount.toFixed(2)}
          </span>

        </div>

      </div>

    `;


  } catch (error) {

    console.error(
      "Payment confirmation error:",
      error
    );


    showError(
      error.message ||
      "Payment verification failed."
    );

  }

}


/* =========================
   START
========================= */

verifyPayment();

</script></body>
