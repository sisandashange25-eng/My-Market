<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>ZYRE Marketing - Payment</title>

  <meta
    name="description"
    content="ZYRE Marketing secure payment confirmation."
  >

  <style>
    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      font-family:Arial,sans-serif;
      background:#f5f5f5;
      color:#111;
    }

    header{
      background:#111;
      color:#fff;
      padding:18px;
      text-align:center;
    }

    header h1{
      margin:0;
      font-size:22px;
      letter-spacing:1px;
    }

    header p{
      margin:6px 0 0;
      font-size:13px;
      color:#ccc;
    }

    .container{
      width:92%;
      max-width:600px;
      margin:30px auto;
    }

    .card{
      background:#fff;
      border-radius:14px;
      padding:22px;
      box-shadow:0 4px 18px rgba(0,0,0,.08);
    }

    .badge{
      display:inline-block;
      background:#111;
      color:#fff;
      padding:7px 12px;
      border-radius:20px;
      font-size:12px;
      font-weight:bold;
      margin-bottom:15px;
    }

    h2{
      margin-top:0;
      font-size:22px;
    }

    .order-box{
      background:#f7f7f7;
      border-radius:10px;
      padding:15px;
      margin:18px 0;
    }

    .row{
      display:flex;
      justify-content:space-between;
      gap:15px;
      padding:8px 0;
      border-bottom:1px solid #ddd;
    }

    .row:last-child{
      border-bottom:none;
    }

    .label{
      color:#666;
    }

    .value{
      font-weight:bold;
      text-align:right;
    }

    .total{
      font-size:22px;
      font-weight:bold;
      margin-top:10px;
    }

    .breakdown{
      margin-top:20px;
      padding:15px;
      background:#fafafa;
      border:1px solid #ddd;
      border-radius:10px;
    }

    .breakdown h3{
      margin-top:0;
      font-size:16px;
    }

    .success{
      margin-top:20px;
      padding:18px;
      background:#e9f8ed;
      border:1px solid #9bd3a6;
      border-radius:10px;
      line-height:1.6;
    }

    .error{
      margin-top:20px;
      padding:18px;
      background:#fff0f0;
      border:1px solid #e2a0a0;
      border-radius:10px;
      white-space:pre-wrap;
      line-height:1.5;
    }

    .loading{
      text-align:center;
      padding:30px;
      color:#666;
    }

    .small{
      font-size:12px;
      color:#777;
      margin-top:12px;
      line-height:1.5;
    }

    footer{
      text-align:center;
      padding:25px 15px;
      color:#777;
      font-size:12px;
    }
  </style>
</head>

<body>

<header>
  <h1>ZYRE Marketing</h1>
  <p>Payment Confirmation</p>
</header>

<div class="container">

  <div class="card">

    <div class="badge">
      PAYMENT RESULT
    </div>

    <h2>
      Payment Confirmation
    </h2>

    <div
      id="loading"
      class="loading"
    >
      Verifying your payment...
    </div>

    <div
      id="paymentContent"
      style="display:none;"
    >

      <div class="order-box">

        <div class="row">
          <span class="label">
            Order Number
          </span>

          <span
            class="value"
            id="orderNumber"
          >
            -
          </span>
        </div>

        <div class="row">
          <span class="label">
            Amount
          </span>

          <span
            class="value"
            id="orderAmount"
          >
            R0.00
          </span>
        </div>

        <div class="total">
          Total:
          <span id="totalAmount">
            R0.00
          </span>
        </div>

      </div>

      <div class="breakdown">

        <h3>
          Payment Breakdown
        </h3>

        <div class="row">

          <span class="label">
            ZYRE Marketing Commission (10%)
          </span>

          <span
            class="value"
            id="zyreCommission"
          >
            R0.00
          </span>

        </div>

        <div class="row">

          <span class="label">
            Seller Amount (90%)
          </span>

          <span
            class="value"
            id="sellerAmount"
          >
            R0.00
          </span>

        </div>

      </div>

      <div
        id="successBox"
        class="success"
        style="display:none;"
      ></div>

      <div
        id="errorBox"
        class="error"
        style="display:none;"
      ></div>

    </div>

  </div>

</div>

<footer>
  ZYRE Marketing &copy; 2026
  <br>
  Durban, South Africa
</footer>

<script>

  /* =========================================
     SUPABASE
  ========================================= */

  const SUPABASE_URL =
    "https://gaccizzlwswwynattgda.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_902JguVx0M5DNLWVx8trpA_LUlUMDG0";


  /* =========================================
     URL PARAMETERS
  ========================================= */

  const params =
    new URLSearchParams(
      window.location.search
    );


  const orderId =
    params.get("order_id") ||
    params.get("orderId") ||
    params.get("id");


  const reference =
    params.get("reference") ||
    params.get("trxref");


  /* =========================================
     MONEY
  ========================================= */

  function money(value){

    const number =
      Number(value || 0);

    return (
      "R" +
      number.toFixed(2)
    );

  }


  /* =========================================
     ESCAPE HTML
  ========================================= */

  function esc(value){

    return String(
      value ?? ""
    )
      .replace(/&/g,"&amp;")
      .replace(/</g,"&lt;")
      .replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;")
      .replace(/'/g,"&#039;");

  }


  /* =========================================
     SUPABASE HEADERS
  ========================================= */

  function supabaseHeaders(){

    return {

      "apikey":
        SUPABASE_KEY,

      "Authorization":
        "Bearer " +
        SUPABASE_KEY

    };

  }


  /* =========================================
     LOAD ORDER
  ========================================= */

  async function loadOrder(){

    if(!orderId){

      throw new Error(
        "No order number was supplied."
      );

    }


    const response =
      await fetch(

        SUPABASE_URL +
        "/rest/v1/orders?id=eq." +
        encodeURIComponent(orderId) +
        "&select=*",

        {
          method:"GET",

          headers:
            supabaseHeaders()

        }

      );


    if(!response.ok){

      const text =
        await response.text();

      throw new Error(
        "Could not load the order.\n\n" +
        text
      );

    }


    const orders =
      await response.json();


    if(
      !Array.isArray(orders) ||
      !orders.length
    ){

      throw new Error(
        "Order #" +
        orderId +
        " could not be found."
      );

    }


    return orders[0];

  }


  /* =========================================
     DISPLAY ORDER
  ========================================= */

  function displayOrder(order){

    const amount =
      Number(
        order.total ||
        order.Total ||
        0
      );


    const commission =
      Number(
        (amount * 0.10)
          .toFixed(2)
      );


    const sellerAmount =
      Number(
        (amount - commission)
          .toFixed(2)
      );


    document.getElementById(
      "orderNumber"
    ).textContent =
      "#" + orderId;


    document.getElementById(
      "orderAmount"
    ).textContent =
      money(amount);


    document.getElementById(
      "totalAmount"
    ).textContent =
      money(amount);


    document.getElementById(
      "zyreCommission"
    ).textContent =
      money(commission);


    document.getElementById(
      "sellerAmount"
    ).textContent =
      money(sellerAmount);


    document.getElementById(
      "loading"
    ).style.display =
      "none";


    document.getElementById(
      "paymentContent"
    ).style.display =
      "block";


    return amount;

  }


  /* =========================================
     GET AUTH SESSION
  ========================================= */

  async function getAccessToken(){

    if(
      window.ZYRE_CURRENT_SESSION &&
      window.ZYRE_CURRENT_SESSION.access_token
    ){

      return window
        .ZYRE_CURRENT_SESSION
        .access_token;

    }


    try{

      if(
        !window.ZYRE_AUTH_CLIENT
      ){

        window.ZYRE_AUTH_CLIENT =
          window.supabase
            ? window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
              )
            : null;

      }


      if(
        window.ZYRE_AUTH_CLIENT
      ){

        const result =
          await window
            .ZYRE_AUTH_CLIENT
            .auth
            .getSession();


        if(
          result &&
          result.data &&
          result.data.session &&
          result.data.session.access_token
        ){

          return result
            .data
            .session
            .access_token;

        }

      }

    }catch(error){

      console.warn(
        "Could not retrieve session:",
        error
      );

    }


    return null;

  }


  /* =========================================
     VERIFY PAYSTACK PAYMENT
  ========================================= */

  async function verifyPayment(){

    if(!orderId){

      throw new Error(
        "No order number was supplied."
      );

    }


    if(!reference){

      throw new Error(
        "No Paystack payment reference was returned."
      );

    }


    const accessToken =
      await getAccessToken();


    if(!accessToken){

      throw new Error(
        "Your customer login session could not be found. " +
        "Please return to the marketplace and try the payment again."
      );

    }


    const response =
      await fetch(

        SUPABASE_URL +
        "/functions/v1/paystack-verify",

        {
          method:"POST",

          headers:{

            "apikey":
              SUPABASE_KEY,

            "Authorization":
              "Bearer " +
              accessToken,

            "Content-Type":
              "application/json"

          },

          body:
            JSON.stringify({

              order_id:
                orderId,

              reference:
                reference

            })

        }

      );


    const text =
      await response.text();


    let data = null;


    try{

      data =
        text
          ? JSON.parse(text)
          : null;

    }catch(error){

      data = null;

    }


    if(!response.ok){

      throw new Error(

        data &&
        data.error

          ? data.error +
            (
              data.details
                ? "\n\n" +
                  JSON.stringify(
                    data.details,
                    null,
                    2
                  )
                : ""
            )

          : text ||
            "Paystack verification failed."

      );

    }


    if(
      !data ||
      !data.success
    ){

      throw new Error(
        "Paystack payment could not be verified."
      );

    }


    return data;

  }


  /* =========================================
     SHOW SUCCESS
  ========================================= */

  function showSuccess(data){

    const successBox =
      document.getElementById(
        "successBox"
      );


    successBox.innerHTML =

      "<strong>✅ Payment Successful</strong><br><br>" +

      "Order #" +
      esc(orderId) +
      " has been marked as <strong>Paid</strong>.<br><br>" +

      "Customer paid: <strong>" +
      money(data.amount) +
      "</strong><br>" +

      "ZYRE Marketing 10%: <strong>" +
      money(
        Number(data.amount) * 0.10
      ) +
      "</strong><br>" +

      "Seller 90%: <strong>" +
      money(
        Number(data.amount) * 0.90
      ) +
      "</strong><br><br>" +

      "<span class='small'>" +
      "Paystack reference: " +
      esc(data.reference) +
      "</span>";


    successBox.style.display =
      "block";

  }


  /* =========================================
     SHOW ERROR
  ========================================= */

  function showError(message){

    const errorBox =
      document.getElementById(
        "errorBox"
      );


    errorBox.textContent =
      message;


    errorBox.style.display =
      "block";

  }


  /* =========================================
     START
  ========================================= */

  window.addEventListener(
    "DOMContentLoaded",
    async function(){

      try{

        const order =
          await loadOrder();


        displayOrder(order);


        const result =
          await verifyPayment();


        showSuccess(result);

      }catch(error){

        console.error(
          "ZYRE Paystack verification error:",
          error
        );


        document.getElementById(
          "loading"
        ).style.display =
          "none";


        document.getElementById(
          "paymentContent"
        ).style.display =
          "block";


        showError(
          error &&
          error.message
            ? error.message
            : String(error)
        );

      }

    }
  );

</script>

</body>
</html>
