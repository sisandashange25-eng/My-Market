<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>ZYRE Marketing | Payment Confirmation</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 520px;
      background: #fff;
      border-radius: 18px;
      padding: 30px 22px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
      text-align: center;
    }

    .logo {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 3px;
      margin-bottom: 5px;
    }

    .subtitle {
      color: #777;
      font-size: 14px;
      margin-bottom: 25px;
    }

    .title {
      font-size: 23px;
      font-weight: 700;
      margin-bottom: 20px;
    }

    .status {
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 20px;
      font-weight: 600;
      line-height: 1.5;
    }

    .success {
      background: #eaf8ee;
      color: #176b35;
    }

    .error {
      background: #fff0f0;
      color: #a00000;
    }

    .loading {
      background: #f2f2f2;
      color: #555;
    }

    .card {
      background: #fafafa;
      border-radius: 14px;
      padding: 18px;
      margin-top: 15px;
      text-align: left;
    }

    .row {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      padding: 9px 0;
      border-bottom: 1px solid #e5e5e5;
    }

    .row:last-child {
      border-bottom: none;
    }

    .label {
      color: #777;
    }

    .value {
      font-weight: 700;
      text-align: right;
    }

    .breakdown-title {
      font-size: 18px;
      font-weight: 700;
      margin: 25px 0 10px;
      text-align: left;
    }

    .button {
      display: inline-block;
      margin-top: 25px;
      padding: 13px 20px;
      border-radius: 10px;
      background: #111;
      color: #fff;
      text-decoration: none;
      font-weight: 700;
    }

    .footer {
      margin-top: 25px;
      color: #888;
      font-size: 12px;
    }
  </style>

  <!-- Supabase browser library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

  <div class="container">

    <div class="logo">
      ZYRE
    </div>

    <div class="subtitle">
      ZYRE Marketing
    </div>

    <div class="title">
      Payment Confirmation
    </div>

    <div id="statusBox" class="status loading">
      Verifying your payment...
    </div>

    <div id="paymentDetails"></div>

    <a
      class="button"
      href="https://sisandashange25-eng.github.io/My-Market/index.html"
    >
      Return to Marketplace
    </a>

    <div class="footer">
      ZYRE Marketing © 2026<br>
      Durban, South Africa
    </div>

  </div>

<script>
const SUPABASE_URL =
  "https://gaccizzlwswwynattgda.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_902JguVx0M5DNLWVx8trpA_LUlUMDG0";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY,
    {
      auth: {
        persistSession: true,
        autoRefreshToken: true,
        detectSessionInUrl: true
      }
    }
  );

const statusBox =
  document.getElementById("statusBox");

const paymentDetails =
  document.getElementById("paymentDetails");


function showError(message) {

  statusBox.className =
    "status error";

  statusBox.innerHTML =
    message;
}


function showSuccess(message) {

  statusBox.className =
    "status success";

  statusBox.innerHTML =
    message;
}


async function getCustomerSession() {

  /*
    First try the Supabase browser session.
    Supabase stores the session in browser
    storage when persistSession is enabled.
  */

  const {
    data,
    error
  } =
    await supabaseClient.auth.getSession();

  if (
    !error &&
    data &&
    data.session
  ) {

    return data.session;
  }

  /*
    Backup:
    some versions of the marketplace
    may already have placed the session
    in this variable.
  */

  if (
    window.ZYRE_CURRENT_SESSION &&
    window.ZYRE_CURRENT_SESSION.access_token
  ) {

    return window.ZYRE_CURRENT_SESSION;
  }

  return null;
}


async function loadOrder(orderId, session) {

  const response =
    await fetch(
      SUPABASE_URL +
      "/rest/v1/orders" +
      "?select=id,total,status" +
      "&id=eq." +
      encodeURIComponent(orderId),
      {
        method: "GET",

        headers: {
          "apikey": SUPABASE_KEY,

          "Authorization":
            "Bearer " +
            session.access_token
        }
      }
    );

  if (!response.ok) {

    const text =
      await response.text();

    throw new Error(
      "Could not load order: " +
      text
    );
  }

  const orders =
    await response.json();

  if (
    !orders ||
    orders.length === 0
  ) {

    throw new Error(
      "Order #" +
      orderId +
      " could not be found."
    );
  }

  return orders[0];
}


async function verifyPayment() {

  try {

    /*
      Read Paystack callback information.
    */

    const params =
      new URLSearchParams(
        window.location.search
      );

    const orderId =
      params.get("order_id");

    const reference =
      params.get("reference") ||
      params.get("trxref");

    if (!orderId) {

      showError(
        "No order number was supplied."
      );

      return;
    }

    if (!reference) {

      showError(
        "No Paystack payment reference was supplied."
      );

      return;
    }

    /*
      Get the customer's Supabase session.
    */

    const session =
      await getCustomerSession();

    if (!session) {

      showError(
        "Your customer login session could not be found. " +
        "Please return to the marketplace and log in again before retrying payment."
      );

      return;
    }

    /*
      Load the order.
    */

    const order =
      await loadOrder(
        orderId,
        session
      );

    /*
      Verify the payment through the
      secure Supabase Edge Function.
    */

    const verifyResponse =
      await fetch(
        SUPABASE_URL +
        "/functions/v1/paystack-verify",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json",

            "apikey":
              SUPABASE_KEY,

            "Authorization":
              "Bearer " +
              session.access_token
          },

          body: JSON.stringify({
            order_id:
              order.id,

            reference:
              reference
          })
        }
      );

    const result =
      await verifyResponse.json();

    if (
      !verifyResponse.ok ||
      !result.success
    ) {

      throw new Error(
        result.error ||
        "Payment verification failed."
      );
    }

    /*
      SUCCESS
    */

    showSuccess(
      "Payment successful! Your order has been marked as Paid."
    );

    paymentDetails.innerHTML = `

      <div class="card">

        <div class="row">
          <span class="label">
            Order Number
          </span>

          <span class="value">
            #${order.id}
          </span>
        </div>

        <div class="row">
          <span class="label">
            Amount
          </span>

          <span class="value">
            R${Number(order.total).toFixed(2)}
          </span>
        </div>

      </div>

      <div class="breakdown-title">
        Payment Breakdown
      </div>

      <div class="card">

        <div class="row">
          <span class="label">
            ZYRE Marketing Commission (10%)
          </span>

          <span class="value">
            R${(Number(order.total) * 0.10).toFixed(2)}
          </span>
        </div>

        <div class="row">
          <span class="label">
            Seller Amount (90%)
          </span>

          <span class="value">
            R${(Number(order.total) * 0.90).toFixed(2)}
          </span>
        </div>

      </div>

    `;

  } catch (error) {

    console.error(
      "Payment confirmation error:",
      error
    );

    showError(
      error.message ||
      "Payment verification failed."
    );
  }
}


verifyPayment();
</script>

</body>
</html>
