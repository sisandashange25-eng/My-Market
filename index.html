<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MyMarket — Online Marketplace</title><link rel="stylesheet" href="style.css"></head>
<body>
<header><div class="brand">MyMarket</div><input id="search" placeholder="Search products..." oninput="renderProducts()"><button onclick="toggleCart()">🛒 Cart <span id="cartCount">0</span></button></header>
<nav><button onclick="setCategory('All')">All</button><button onclick="setCategory('Electronics')">Electronics</button><button onclick="setCategory('Fashion')">Fashion</button><button onclick="setCategory('Home')">Home</button><button onclick="setCategory('Beauty')">Beauty</button></nav>
<main><section class="hero"><h1>Shop everything in one place.</h1><p>Buy from independent sellers and discover great deals.</p></section>
<div class="toolbar"><h2 id="heading">All products</h2><select id="sort" onchange="renderProducts()"><option value="popular">Popular</option><option value="low">Price: low to high</option><option value="high">Price: high to low</option></select></div>
<section id="products" class="grid"></section></main>
<aside id="cart" class="drawer"><button class="close" onclick="toggleCart()">✕</button><h2>Your Cart</h2><div id="cartItems"></div><div class="total">Total: R<span id="total">0.00</span></div><button class="checkout" onclick="checkout()">Checkout</button></aside>
<footer>© 2026 MyMarket • Seller Centre • Customer Support</footer>
<script src="app.js"></script></body></html>
