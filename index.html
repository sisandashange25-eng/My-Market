<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZavaMarket — Shop Online</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <div class="brand">Zava<span>Market</span></div>

  <input
    id="search"
    placeholder="Search products..."
    oninput="renderProducts()"
  >

  <button onclick="toggleCart()">
    🛒 Cart <b id="cartCount">0</b>
  </button>
</header>

<nav>
  <button onclick="setCategory('All')">All</button>
  <button onclick="setCategory('Electronics')">Electronics</button>
  <button onclick="setCategory('Fashion')">Fashion</button>
  <button onclick="setCategory('Home')">Home</button>
  <button onclick="setCategory('Beauty')">Beauty</button>
</nav>

<main>

<section class="hero">
  <div>
    <p class="eyebrow">WELCOME TO ZAVAMARKET</p>

    <h1>
      Everything you need.<br>
      <span>All in one place.</span>
    </h1>

    <p>
      Shop great products from independent sellers,
      right from your phone.
    </p>

    <button
      class="shop"
      onclick="document.getElementById('products').scrollIntoView({behavior:'smooth'})"
    >
      Shop now →
    </button>
  </div>

  <div class="heroicon">🛍️</div>
</section>

<div class="toolbar">
  <h2 id="heading">All products</h2>

  <select id="sort" onchange="renderProducts()">
    <option value="popular">Popular</option>
    <option value="low">Price: low to high</option>
    <option value="high">Price: high to low</option>
  </select>
</div>

<section id="products" class="grid"></section>

</main>

<aside id="cart" class="drawer">

  <button class="close" onclick="toggleCart()">✕</button>

  <h2>Your Cart</h2>

  <div id="cartItems"></div>

  <div class="total">
    Total: R<span id="total">0.00</span>
  </div>

  <button class="checkout" onclick="checkout()">
    Continue to checkout
  </button>

</aside>

<footer>

  <strong>ZavaMarket</strong><br>

  <span>
    Shop smart. Shop local. Shop Zava.
  </span><br>

  <small>
    © 2026 ZavaMarket •
    <button onclick="sellerCentre()">Seller Centre</button>
    <button onclick="window.location.href='track.html'">📦 Track Order</button>
<button onclick="window.location.href='orders.html'">📋 My Orders</button>
• Customer Support
  </small>

</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="app.js?v=1000"></script>

</body>
</html>
