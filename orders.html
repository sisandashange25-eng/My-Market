<!doctype html>
<html lang="en">

<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>ZavaMarket — My Orders</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f6f7f9;
  color:#111;
}

header{
  background:#111;
  color:white;
  padding:20px;
  text-align:center;
}

.logo{
  font-size:25px;
  font-weight:bold;
}

.logo span{
  color:#ff7a00;
}

main{
  max-width:650px;
  margin:25px auto;
  padding:20px;
}

.card{
  background:white;
  border-radius:18px;
  padding:22px;
  margin-bottom:15px;
  box-shadow:0 5px 20px rgba(0,0,0,.08);
}

.order{
  border:1px solid #eee;
  border-radius:14px;
  padding:18px;
  margin-top:15px;
}

.status{
  display:inline-block;
  padding:7px 12px;
  border-radius:20px;
  background:#fff0df;
  color:#e66b00;
  font-weight:bold;
}

.track{
  width:100%;
  margin-top:15px;
  background:#ff7a00;
  color:white;
  font-weight:bold;
}

.back{
  background:#eee;
  margin-top:10px;
}

.empty{
  text-align:center;
  padding:30px 10px;
  color:#777;
}

</style>

</head>


<body>

<header>

  <div class="logo">
    Zava<span>Market</span>
  </div>

  <div>My Orders</div>

</header>


<main>

  <div class="card">

    <h1>📦 My Orders</h1>

    <p>
      Enter the phone number you used when placing your order.
    </p>

    <input
      id="phone"
      type="tel"
      placeholder="Phone number"
      style="
        width:100%;
        padding:15px;
        border:1px solid #ddd;
        border-radius:10px;
        font-size:16px;
        margin:10px 0;
      "
    >

    <button
      onclick="loadOrders()"
      style="
        width:100%;
        background:#ff7a00;
        color:white;
        border:0;
        border-radius:10px;
        padding:14px;
        font-size:16px;
        font-weight:bold;
      "
    >
      Find My Orders
    </button>

  </div>


  <div id="orders"></div>


  <button
    class="back"
    onclick="window.location.href='index.html'"
  >
    ← Back to ZavaMarket
  </button>

</main>


<script>

const SUPABASE_URL =
"https://gaccizzlwswwynattgda.supabase.co";

const SUPABASE_KEY =
"sb_publishable_902JguVx0M5DNLWVx8trpA_LUlUMDG0";


async function loadOrders(){

  const phone =
    document.getElementById("phone").value.trim();

  const box =
    document.getElementById("orders");


  if(!phone){

    alert("Please enter your phone number.");

    return;
  }


  box.innerHTML =
    "<div class='card'>Loading your orders...</div>";


  try{

    const profileResponse =
      await fetch(

        SUPABASE_URL +
        "/rest/v1/profiles?phone=eq." +
        encodeURIComponent(phone) +
        "&select=id,full_name,phone",

        {
          headers:{
            "apikey":SUPABASE_KEY,
            "Authorization":
              "Bearer " + SUPABASE_KEY
          }
        }

      );


    if(!profileResponse.ok){

      throw new Error(
        await profileResponse.text()
      );

    }


    const profiles =
      await profileResponse.json();


    if(!profiles.length){

      box.innerHTML =
        "<div class='card empty'>No customer found with that phone number.</div>";

      return;
    }


    const customerId =
      profiles[0].id;


    const ordersResponse =
      await fetch(

        SUPABASE_URL +
        "/rest/v1/orders?customer_id=eq." +
        customerId +
        "&select=id,total,status,delivery_address,created_at&order=id.desc",

        {
          headers:{
            "apikey":SUPABASE_KEY,
            "Authorization":
              "Bearer " + SUPABASE_KEY
          }
        }

      );


    if(!ordersResponse.ok){

      throw new Error(
        await ordersResponse.text()
      );

    }


    const orders =
      await ordersResponse.json();


    if(!orders.length){

      box.innerHTML =
        "<div class='card empty'>You have no orders yet.</div>";

      return;
    }


    box.innerHTML =
      orders.map(order => `

        <div class="card order">

          <h2>📦 Order #${order.id}</h2>

          <div class="status">
            ${order.status}
          </div>

          <p>
            💰 Total:
            <strong>
              R${Number(order.total).toFixed(2)}
            </strong>
          </p>

          <p>
            🏠 ${order.delivery_address || "Not provided"}
          </p>

          <p>
            🕐
            ${new Date(order.created_at).toLocaleString()}
          </p>

          <button
            class="track"
            onclick="trackOrder(${order.id})"
          >
            Track this order
          </button>

        </div>

      `).join("");


  }catch(error){

    console.log(error);

    box.innerHTML =
      "<div class='card empty'>Could not load your orders. Please try again.</div>";

  }

}


function trackOrder(id){

  window.location.href =
    "track.html?order=" + id;

}

</script>

</body>

</html>
