<style>
*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:#090909;
color:#fff;
}

header{
background:#090909;
color:white;
padding:24px 20px;
text-align:center;
border-bottom:1px solid #252525;
}

.logo{
font-size:28px;
font-weight:800;
letter-spacing:2px;
}

.logo span{

}

header div:last-child{
margin-top:6px;
color:#aaa;
font-size:14px;
}

main{
max-width:650px;
margin:30px auto;
padding:20px;
}

.card{
background:#111;
border:1px solid #252525;
border-radius:22px;
padding:25px;
box-shadow:0 10px 35px rgba(0,0,0,.35);
}

h1{
margin-top:0;
font-size:26px;
}

.intro{
color:#aaa;
line-height:1.5;
}

input{
width:100%;
padding:15px;
border:1px solid #333;
background:#191919;
color:#fff;
border-radius:12px;
font-size:16px;
margin:10px 0;
outline:none;
}

input:focus{
border-color:#d4af37;
}

button{
border:0;
border-radius:12px;
padding:14px 18px;
font-size:16px;
cursor:pointer;
}

.find{
width:100%;
background:#d4af37;
color:#111;
font-weight:bold;
}

.find:hover{
background:#e3c45c;
}

.order{
background:#151515;
border:1px solid #292929;
border-radius:18px;
padding:20px;
margin-top:20px;
}

.order h2{
margin:0 0 12px;
font-size:21px;
}

.status{
display:inline-block;
padding:8px 14px;
border-radius:20px;
background:#29220d;
color:#d4af37;
font-weight:bold;
text-transform:capitalize;
}

.order p{
color:#ccc;
line-height:1.5;
}

.order strong{
color:#fff;
}

/* TRACKING */

.tracking{
margin:25px 0 10px;
padding:18px 10px 8px;
background:#0d0d0d;
border-radius:15px;
border:1px solid #242424;
}

.tracking-title{
font-size:13px;
font-weight:bold;
color:#d4af37;
margin-bottom:22px;
text-align:center;
letter-spacing:.5px;
}

.progress{
display:flex;
align-items:flex-start;
justify-content:space-between;
position:relative;
}

.progress-line{
position:absolute;
top:12px;
left:9%;
right:9%;
height:3px;
background:#333;
z-index:0;
}

.progress-fill{
position:absolute;
top:12px;
left:9%;
height:3px;
background:#d4af37;
z-index:1;
transition:width .3s ease;
}

.step{
position:relative;
z-index:2;
width:25%;
text-align:center;
}

.dot{
width:26px;
height:26px;
margin:0 auto 8px;
border-radius:50%;
background:#292929;
border:2px solid #444;
display:flex;
align-items:center;
justify-content:center;
font-size:12px;
}

.step.active .dot{
background:#d4af37;
border-color:#d4af37;
color:#111;
}

.step-label{
font-size:10px;
color:#777;
line-height:1.2;
}

.step.active .step-label{
color:#fff;
font-weight:bold;
}

/* DELIVERY */

.delivery-box{
margin-top:18px;
padding:16px;
background:#0d0d0d;
border:1px solid #292929;
border-radius:15px;
}

.delivery-title{
color:#d4af37;
font-weight:bold;
font-size:15px;
margin-bottom:12px;
}

.delivery-row{
padding:7px 0;
color:#ccc;
font-size:14px;
line-height:1.4;
}

.delivery-row strong{
color:#fff;
}

.delivery-status{
display:inline-block;
padding:6px 10px;
border-radius:10px;
background:#29220d;
color:#d4af37;
font-weight:bold;
}

.delivery-loading{
color:#777;
font-size:14px;
}

.track{
width:100%;
margin-top:15px;
background:#d4af37;
color:#111;
font-weight:bold;
}

.track:hover{
background:#e3c45c;
}

.back{
width:100%;
margin-top:20px;
background:#222;
color:#fff;
border:1px solid #333;
}

.back:hover{
background:#2c2c2c;
}

footer{
text-align:center;
padding:30px;
color:#777;
font-size:14px;
}

footer strong{
color:#d4af37;
}

@media(max-width:480px){

main{
margin:15px auto;
padding:12px;
}

.card{
padding:20px 15px;
}

h1{

}

.step-label{

}

<body>

<header>

<div class="logo">
ZYRE<span>MARKETING</span>
</div>

<div>My Orders</div>

</header>

<main>

<div class="card">

<h1>📦 My Orders</h1>

<p class="intro">
Enter the phone number you used when placing your order.
</p>

<input
id="phone"
type="tel"
placeholder="Phone number"
>

<button
class="find"
onclick="findOrders()"
>
Find My Orders
</button>

<div id="result"></div>

<button
class="back"
onclick="window.location.href='index.html'"
>
← Back to ZYRE Marketing
</button>

</div>

</main>

<footer>

<strong>ZYRE Marketing</strong><br>

Shop smart. Shop local.

</footer>


<script>

const SUPABASE_URL=
"https://gaccizzlwswwynattgda.supabase.co";

const SUPABASE_KEY=
"sb_publishable_902JguVx0M5DNLWVx8trpA_LUlUMDG0";


function getTrackingStatus(status){

const value=
String(status || "")
.toLowerCase()
.trim();

if(value==="pending" || value==="paid"){
return 0;
}

if(value==="processing"){
return 1;
}

if(value==="shipped"){
return 2;
}

if(value==="delivered"){
return 3;
}

return 0;

}


function createTracking(order){

const current=
getTrackingStatus(order.status);

const steps=[
{
icon:"🛒",
label:"Order Placed"
},
{
icon:"⚙️",
label:"Processing"
},
{
icon:"🚚",
label:"Shipped"
},
{
icon:"🏠",
label:"Delivered"
}
];

const fillWidth=
(current / 3) * 82;

return `

<div class="tracking">

<div class="tracking-title">
ORDER TRACKING
</div>

<div class="progress">

<div class="progress-line"></div>

<div
class="progress-fill"
style="width:${fillWidth}%"
></div>

${steps.map((step,index)=>`

<div class="step ${index<=current ? "active" : ""}">

<div class="dot">
${step.icon}
</div>

<div class="step-label">
${step.label}
</div>

</div>

`).join("")}

</div>

</div>

`;

}


/* DELIVERY INFORMATION */

async function getDelivery(orderId){

try{

const response=await fetch(

SUPABASE_URL+
"/rest/v1/deliveries?order_id=eq."+
encodeURIComponent(orderId)+
"&select=*",

{

method:"GET",

headers:{

"apikey":SUPABASE_KEY,

"Authorization":
"Bearer "+SUPABASE_KEY

}

}

);

if(!response.ok){

console.error(
"Delivery lookup failed:",
await response.text()
);

return null;

}

const deliveries=
await response.json();

if(!deliveries.length){

return null;

}

return deliveries[0];

}catch(error){

console.error(
"Delivery lookup error:",
error
);

return null;

}

}


/* DELIVERY DISPLAY */

function createDeliveryBox(delivery){

if(!delivery){

return `

<div class="delivery-box">

<div class="delivery-title">
🚚 Delivery Information
</div>

<div class="delivery-loading">
Delivery has not been assigned yet.
</div>

</div>

`;

}

return `

<div class="delivery-box">

<div class="delivery-title">
🚚 Delivery Information
</div>

<div class="delivery-row">

<strong>Status:</strong>

<span class="delivery-status">
${delivery.status || "Assigned"}
</span>

</div>

<div class="delivery-row">

<strong>👤 Delivery Person:</strong>

${delivery.delivery_person_name || "Not assigned"}

</div>

<div class="delivery-row">

<strong>📞 Phone:</strong>

${delivery.delivery_person_phone || "Not provided"}

</div>

<div class="delivery-row">

<strong>🔢 Tracking Number:</strong>

${delivery.tracking_number || "Not provided"}

</div>

<div class="delivery-row">

<strong>📅 Estimated Delivery:</strong>

${delivery.estimated_delivery
? new Date(
delivery.estimated_delivery+"T00:00:00"
).toLocaleDateString()
: "Not provided"}

</div>

${delivery.notes ? `

<div class="delivery-row">

<strong>📝 Notes:</strong>

${delivery.notes}

</div>

` : ""}

</div>

`;

}


async function findOrders(){

const phone=
document.getElementById("phone").value.trim();

const result=
document.getElementById("result");


if(!phone){

alert("Please enter your phone number.");

return;

}


result.innerHTML=
"<p>Loading your orders...</p>";


try{


const response=await fetch(

SUPABASE_URL+
"/rest/v1/rpc/get_orders_by_phone",

{

method:"POST",

headers:{

"apikey":SUPABASE_KEY,

"Authorization":
"Bearer "+SUPABASE_KEY,

"Content-Type":
"application/json"

},

body:JSON.stringify({

user_phone:phone

})

}

);


if(!response.ok){

throw new Error(
await response.text()
);

}


const orders=
await response.json();


console.log("ORDERS:",orders);


if(!orders.length){

result.innerHTML=
"<p>No orders found for this phone number.</p>";

return;

}


/*
Load delivery information for every order.
*/

const ordersWithDelivery=
await Promise.all(

orders.map(async order=>{

const delivery=
await getDelivery(order.id);

return{

...order,

delivery

};

})

);


result.innerHTML=
ordersWithDelivery.map(order=>`

<div class="order">

<h2>
📦 Order #${order.id}
</h2>

<div class="status">
${order.status}
</div>

${createTracking(order)}

<p>
💰 <strong>Total:</strong>
R${Number(order.total).toFixed(2)}
</p>

<p>
🏠 <strong>Delivery:</strong>
${order.delivery_address || "Not provided"}
</p>

<p>
🕐 <strong>Ordered:</strong>
${new Date(order.created_at).toLocaleString()}
</p>

${createDeliveryBox(order.delivery)}

<button
class="track"
onclick="window.location.href='track.html?order=${order.id}'"
>
📦 Track Order
</button>

</div>

`).join("");


}catch(error){

console.error(error);

result.innerHTML=
"<p>Error loading orders.</p>";

}

}

</script>

</body>
