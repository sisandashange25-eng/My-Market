<!doctype html>
<html lang="en">
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>ZavaMarket — Track Order</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f6f7f9;
  color:#111;
}

header{
  background:#111;
  color:white;
  padding:20px;
  text-align:center;
}

.logo{
  font-size:25px;
  font-weight:bold;
}

.logo span{
  color:#ff7a00;
}

main{
  max-width:600px;
  margin:30px auto;
  padding:20px;
}

.card{
  background:white;
  border-radius:18px;
  padding:25px;
  box-shadow:0 5px 20px rgba(0,0,0,.08);
}

h1{
  margin-top:0;
}

input{
  width:100%;
  padding:15px;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:16px;
  margin:10px 0;
}

button{
  border:0;
  border-radius:10px;
  padding:14px 18px;
  font-size:16px;
  cursor:pointer;
}

.trackBtn{
  width:100%;
  background:#ff7a00;
  color:white;
  font-weight:bold;
}

.back{
  margin-top:20px;
  background:#eee;
}

#result{
  margin-top:25px;
}

.order{
  background:#f8f8f8;
  border-radius:14px;
  padding:20px;
}

.status{
  display:inline-block;
  padding:8px 14px;
  border-radius:20px;
  background:#fff0df;
  color:#e66b00;
  font-weight:bold;
}

/* PROGRESS */

.progress{
  display:flex;
  justify-content:space-between;
  position:relative;
  margin:35px 5px;
}

.progress:before{
  content:"";
  position:absolute;
  top:16px;
  left:10%;
  right:10%;
  height:4px;
  background:#ddd;
  z-index:0;
}

.step{
  position:relative;
  z-index:1;
  text-align:center;
  width:25%;
  font-size:12px;
  color:#999;
}

.circle{
  width:34px;
  height:34px;
  border-radius:50%;
  background:#ddd;
  margin:0 auto 8px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
}

.step.active{
  color:#ff7a00;
  font-weight:bold;
}

.step.active .circle{
  background:#ff7a00;
  color:white;
}

.details{
  margin-top:20px;
  line-height:1.8;
}

.cancelled{
  background:#ffe5e5;
  color:#c00;
  padding:15px;
  border-radius:10px;
  font-weight:bold;
}

footer{
  text-align:center;
  padding:30px;
  color:#777;
}

</style>

</head>

<body>

<header>

  <div class="logo">
    Zava<span>Market</span>
  </div>

  <div>Track your order</div>

</header>


<main>

  <div class="card">

    <h1>📦 Track Order</h1>

    <p>
      Enter your ZavaMarket order number below.
    </p>

    <input
      id="orderId"
      type="number"
      placeholder="Order number"
    >

    <button
      class="trackBtn"
      onclick="trackOrder()"
    >
      Track Order
    </button>

    <div id="result"></div>

    <button
      class="back"
      onclick="window.location.href='index.html'"
    >
      ← Back to ZavaMarket
    </button>

  </div>

</main>


<footer>

  <strong>ZavaMarket</strong><br>

  Shop smart. Shop local. Shop Zava.

</footer>


<script>

const SUPABASE_URL =
"https://gaccizzlwswwynattgda.supabase.co";

const SUPABASE_KEY =
"sb_publishable_902JguVx0M5DNLWVx8trpA_LUlUMDG0";


function createProgress(status){

  const steps = [
    "Pending",
    "Processing",
    "Shipped",
    "Delivered"
  ];

  const current =
    steps.indexOf(status);

  return `
    <div class="progress">

      ${steps.map((step,index)=>`

        <div class="step ${
          index <= current ? "active" : ""
        }">

          <div class="circle">
            ${index <= current ? "✓" : ""}
          </div>

          ${step}

        </div>

      `).join("")}

    </div>
  `;
}


async function trackOrder(){

  const orderId =
    document.getElementById("orderId").value.trim();

  if(!orderId){

    alert("Please enter your order number.");

    return;
  }


  const result =
    document.getElementById("result");

  result.innerHTML =
    "<p>Loading order...</p>";


  try{

    const response = await fetch(

      SUPABASE_URL +
      "/rest/v1/orders?id=eq." +
      orderId +
      "&select=id,total,status,delivery_address,created_at",

      {
        headers:{
          "apikey":SUPABASE_KEY,
          "Authorization":
            "Bearer " + SUPABASE_KEY
        }
      }

    );


    if(!response.ok){

      throw new Error(
        await response.text()
      );

    }


    const orders =
      await response.json();


    if(!orders.length){

      result.innerHTML =
        "<p>Order #" +
        orderId +
        " was not found.</p>";

      return;
    }


    const order = orders[0];


    if(order.status === "Cancelled"){

      result.innerHTML = `

        <div class="order">

          <h2>📦 Order #${order.id}</h2>

          <div class="cancelled">
            ❌ This order has been cancelled.
          </div>

        </div>

      `;

      return;
    }


    result.innerHTML = `

      <div class="order">

        <h2>📦 Order #${order.id}</h2>

        <div class="status">
          ${order.status}
        </div>

        ${createProgress(order.status)}

        <div class="details">

          💰 <strong>Total:</strong>
          R${Number(order.total).toFixed(2)}

          <br>

          🏠 <strong>Delivery:</strong>
          ${order.delivery_address || "Not provided"}

          <br>

          🕐 <strong>Ordered:</strong>
          ${new Date(order.created_at).toLocaleString()}

        </div>

      </div>

    `;


  }catch(error){

    console.log(error);

    result.innerHTML =
      "<p>Could not load your order. Please try again.</p>";

  }

}

</script>

</body>
</html>
