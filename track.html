<!doctype html>
<html lang="en">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>ZavaMarket — Track Order</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f6f8;
  color:#222;
}

header{
  background:#111827;
  color:white;
  padding:20px;
  text-align:center;
}

header h1{
  margin:0;
  font-size:24px;
}

header p{
  margin:7px 0 0;
  opacity:.8;
}

main{
  max-width:600px;
  margin:30px auto;
  padding:15px;
}

.card{
  background:white;
  border-radius:16px;
  padding:22px;
  box-shadow:0 3px 15px rgba(0,0,0,.08);
}

input{
  width:100%;
  padding:14px;
  margin-top:8px;
  border:1px solid #ddd;
  border-radius:9px;
  font-size:16px;
}

button{
  width:100%;
  padding:14px;
  margin-top:15px;
  border:0;
  border-radius:9px;
  background:#111827;
  color:white;
  font-size:16px;
  font-weight:bold;
}

.back{
  background:#6b7280;
}

#result{
  margin-top:20px;
}

.order{
  border:1px solid #ddd;
  border-radius:12px;
  padding:18px;
}

.order h2{
  margin-top:0;
}

.status{
  display:inline-block;
  padding:8px 12px;
  border-radius:20px;
  background:#fef3c7;
  color:#92400e;
  font-weight:bold;
}

.row{
  padding:10px 0;
  border-bottom:1px solid #eee;
}

.row:last-child{
  border-bottom:0;
}

.label{
  font-weight:bold;
}

.error{
  padding:14px;
  border-radius:10px;
  background:#fee2e2;
  color:#991b1b;
}

/* ORDER PROGRESS */

.progress{
  margin:25px 0;
}

.progress-title{
  font-weight:bold;
  margin-bottom:18px;
}

.step{
  display:flex;
  align-items:center;
  margin-bottom:18px;
}

.circle{
  width:38px;
  height:38px;
  border-radius:50%;
  background:#e5e7eb;
  color:#6b7280;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
  flex-shrink:0;
}

.step.active .circle{
  background:#111827;
  color:white;
}

.step-text{
  margin-left:12px;
}

.step-text strong{
  display:block;
}

.step-text span{
  font-size:13px;
  color:#777;
}

.line{
  width:3px;
  height:18px;
  background:#e5e7eb;
  margin-left:18px;
  margin-top:-18px;
  margin-bottom:0;
}

.line.active{
  background:#111827;
}

.cancelled{
  padding:12px;
  border-radius:10px;
  background:#fee2e2;
  color:#991b1b;
  font-weight:bold;
  margin:15px 0;
}

footer{
  text-align:center;
  padding:30px 15px;
  color:#666;
}

</style>

</head>

<body>

<header>

<h1>📦 ZavaMarket</h1>

<p>Track your order</p>

</header>


<main>

<div class="card">

<h2>Track Order</h2>

<p>
Enter your ZavaMarket order number below.
</p>

<input
  id="orderId"
  type="number"
  placeholder="Example: 8"
>

<button onclick="trackOrder()">
  Track Order
</button>

<div id="result"></div>

<button
  class="back"
  onclick="window.location.href='index.html'"
>
  ← Back to ZavaMarket
</button>

</div>

</main>


<footer>

<strong>ZavaMarket</strong>

<br>

Shop smart. Shop local. Shop Zava.

</footer>


<script>

const SUPABASE_URL =
"https://gaccizzlwswwynattgda.supabase.co";

const SUPABASE_KEY =
"sb_publishable_902JguVx0M5DNLWVx8trpA_LUlUMDG0";


function createProgress(status){

  const steps = [
    "Pending",
    "Processing",
    "Shipped",
    "Delivered"
  ];

  if(status === "Cancelled"){

    return `
      <div class="cancelled">
        ❌ This order has been cancelled.
      </div>
    `;

  }

  const currentIndex =
    steps.indexOf(status);

  return `

    <div class="progress">

      <div class="progress-title">
        Delivery Progress
      </div>


      <div class="step ${currentIndex >= 0 ? "active" : ""}">

        <div class="circle">✓</div>

        <div class="step-text">
          <strong>Order Placed</strong>
          <span>Your order has been received.</span>
        </div>

      </div>


      <div class="line ${currentIndex >= 1 ? "active" : ""}"></div>


      <div class="step ${currentIndex >= 1 ? "active" : ""}">

        <div class="circle">✓</div>

        <div class="step-text">
          <strong>Processing</strong>
          <span>Your order is being prepared.</span>
        </div>

      </div>


      <div class="line ${currentIndex >= 2 ? "active" : ""}"></div>


      <div class="step ${currentIndex >= 2 ? "active" : ""}">

        <div class="circle">✓</div>

        <div class="step-text">
          <strong>Shipped</strong>
          <span>Your order is on the way.</span>
        </div>

      </div>


      <div class="line ${currentIndex >= 3 ? "active" : ""}"></div>


      <div class="step ${currentIndex >= 3 ? "active" : ""}">

        <div class="circle">✓</div>

        <div class="step-text">
          <strong>Delivered</strong>
          <span>Your order has arrived.</span>
        </div>

      </div>

    </div>

  `;

}


async function trackOrder(){

  const orderId =
    document.getElementById("orderId").value.trim();

  const result =
    document.getElementById("result");


  if(!orderId){

    result.innerHTML =
      '<div class="error">Please enter your Order ID.</div>';

    return;
  }


  result.innerHTML =
    "<p>Checking your order...</p>";


  try{

    const response = await fetch(

      SUPABASE_URL +
      "/rest/v1/orders?id=eq." +
      orderId +
      "&select=id,total,status,delivery_address,created_at",

      {
        headers:{
          "apikey":SUPABASE_KEY,
          "Authorization":"Bearer "+SUPABASE_KEY
        }
      }

    );


    if(!response.ok){

      const errorText =
        await response.text();

      result.innerHTML =
        '<div class="error">' +
        "Could not check order.<br><br>" +
        errorText +
        "</div>";

      return;
    }


    const orders =
      await response.json();


    if(!orders.length){

      result.innerHTML =
        '<div class="error">' +
        "Order #" +
        orderId +
        " was not found." +
        "</div>";

      return;
    }


    const order = orders[0];


    const date =
      order.created_at
      ? new Date(order.created_at).toLocaleString()
      : "Unknown";


    result.innerHTML = `

      <div class="order">

        <h2>
          📦 Order #${order.id}
        </h2>

        <p>
          <span class="status">
            ${order.status}
          </span>
        </p>


        ${createProgress(order.status)}


        <div class="row">
          <span class="label">💰 Total:</span>
          R${Number(order.total).toFixed(2)}
        </div>

        <div class="row">
          <span class="label">🏠 Delivery:</span>
          ${order.delivery_address || "Not provided"}
        </div>

        <div class="row">
          <span class="label">🕐 Ordered:</span>
          ${date}
        </div>

      </div>

    `;


  }catch(error){

    console.log(
      "Track order error:",
      error
    );

    result.innerHTML =
      '<div class="error">' +
      "Something went wrong. Please try again." +
      "</div>";

  }

}

</script>

</body>

</html>
