<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>ZavaMarket - Track Order</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 25px;
    }

    main {
      max-width: 600px;
      margin: 30px auto;
      padding: 20px;
    }

    .box {
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.08);
    }

    h2 {
      margin-top: 0;
    }

    input {
      width: 100%;
      padding: 14px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border: 0;
      border-radius: 8px;
      background: #111;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    #result {
      margin-top: 25px;
    }

    .order {
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 18px;
      background: #fafafa;
    }

    .order h3 {
      margin-top: 0;
    }

    .status {
      display: inline-block;
      padding: 8px 14px;
      border-radius: 20px;
      background: #111;
      color: white;
      font-weight: bold;
      margin: 8px 0 15px;
    }

    .status.paid {
      background: #198754;
    }

    .status.pending {
      background: #d99a00;
    }

    .status.processing {
      background: #0069d9;
    }

    .status.shipped {
      background: #6f42c1;
    }

    .status.delivered {
      background: #198754;
    }

    .details {
      line-height: 1.7;
    }

    .back {
      margin-top: 20px;
      background: #555;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #777;
      font-size: 14px;
    }

  </style>

</head>


<body>


<header>

  <h1>ZavaMarket</h1>

  <p>Track your order</p>

</header>


<main>

  <div class="box">

    <h2>📦 Track Order</h2>

    <p>
      Enter your order number and phone number below.
    </p>


    <input
      type="number"
      id="orderNumber"
      placeholder="Order number"
    >


    <input
      type="tel"
      id="phone"
      placeholder="Phone number"
    >


    <button onclick="trackOrder()">
      Track Order
    </button>


    <div id="result"></div>


    <button
      class="back"
      onclick="window.location.href='index.html'"
    >
      ← Back to ZavaMarket
    </button>

  </div>

</main>


<footer>

  ZavaMarket<br>

  Shop smart. Shop local. Shop Zava.

</footer>



<script>


const SUPABASE_URL =
  "https://gaccizzlwswwynattgda.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_902JguVx0M5DNLWVx8trpA_LUlUMDG0";



async function trackOrder() {


  const orderNumber =
    document.getElementById(
      "orderNumber"
    ).value.trim();


  const phone =
    document.getElementById(
      "phone"
    ).value.trim();


  const result =
    document.getElementById(
      "result"
    );


  if (!orderNumber || !phone) {

    result.innerHTML =
      "<p>Please enter your order number and phone number.</p>";

    return;

  }


  result.innerHTML =
    "<p>Checking your order...</p>";


  try {


    const response =
      await fetch(

        SUPABASE_URL +
        "/rest/v1/rpc/get_orders_by_phone",

        {

          method: "POST",

          headers: {

            "apikey":
              SUPABASE_KEY,

            "Authorization":
              "Bearer " +
              SUPABASE_KEY,

            "Content-Type":
              "application/json"

          },

          body:
            JSON.stringify({

              user_phone:
                phone

            })

        }

      );


    if (!response.ok) {

      result.innerHTML =
        "<p>Could not check your order.</p>";

      return;

    }


    const orders =
      await response.json();


    if (
      !Array.isArray(orders) ||
      !orders.length
    ) {

      result.innerHTML =
        "<p>No orders were found for that phone number.</p>";

      return;

    }


    const wantedId =
      Number(orderNumber);


    const order =
      orders.find(o => {

        const id =
          o.id ??
          o.order_id ??
          o.orderid;

        return Number(id) === wantedId;

      });


    if (!order) {

      result.innerHTML =
        "<p>Order #" +
        orderNumber +
        " was not found for that phone number.</p>";

      return;

    }


    const displayId =
      order.id ??
      order.order_id ??
      order.orderid;


    const displayTotal =
      order.total ??
      order.order_total ??
      order.amount ??
      0;


    const displayStatus =
      order.status ??
      "Pending";


    const displayAddress =
      order.delivery_address ??
      order.deliveryaddress ??
      "Not provided";


    const createdAt =
      order.created_at ??
      order.createdat ??
      "";


    let formattedDate =
      "Not available";


    if (createdAt) {

      const date =
        new Date(createdAt);

      if (!isNaN(date.getTime())) {

        formattedDate =
          date.toLocaleString(
            "en-ZA"
          );

      }

    }


    const statusClass =
      String(displayStatus)
        .toLowerCase()
        .replace(/\s+/g, "-");


    result.innerHTML = `

      <div class="order">

        <h3>
          📦 Order #${displayId}
        </h3>

        <div class="status ${statusClass}">
          ${displayStatus}
        </div>

        <div class="details">

          <strong>💰 Total:</strong>
          R${Number(displayTotal).toFixed(2)}

          <br>

          <strong>🏠 Delivery:</strong>
          ${displayAddress}

          <br>

          <strong>🕐 Ordered:</strong>
          ${formattedDate}

        </div>

      </div>

    `;


  } catch (error) {

    result.innerHTML =
      "<p>Something went wrong while checking your order.</p>";

  }

}


</script>


</body>

</html>
