<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZavaMarket Seller Dashboard</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f6f8;
color:#222;
}

header{
background:#111827;
color:white;
padding:18px;
}

header h1{
margin:0;
font-size:22px;
}

header p{
margin:5px 0 0;
opacity:.8;
}

main{
max-width:700px;
margin:20px auto;
padding:15px;
}

.card{
background:white;
border-radius:14px;
padding:20px;
margin-bottom:20px;
box-shadow:0 3px 15px rgba(0,0,0,.08);
}

h2{
margin-top:0;
}

label{
display:block;
margin-top:15px;
font-weight:bold;
}

input,textarea,select{
width:100%;
padding:12px;
margin-top:7px;
border:1px solid #ddd;
border-radius:8px;
font-size:16px;
}

textarea{
min-height:100px;
resize:vertical;
}

button{
width:100%;
padding:13px;
margin-top:18px;
border:0;
border-radius:8px;
background:#111827;
color:white;
font-size:16px;
font-weight:bold;
}

.message{
margin-top:15px;
padding:12px;
border-radius:8px;
display:none;
}

.success{
background:#dcfce7;
color:#166534;
}

.error{
background:#fee2e2;
color:#991b1b;
}

.back{
background:#6b7280;
}

.product{
border:1px solid #ddd;
border-radius:10px;
padding:15px;
margin-top:15px;
}

.product img{
width:100%;
max-height:220px;
object-fit:contain;
border-radius:8px;
margin-bottom:10px;
}

.product h3{
margin:5px 0;
}

.product p{
margin:6px 0;
}

.order{
border:1px solid #ddd;
border-radius:10px;
padding:15px;
margin-top:15px;
}

.order strong{
display:block;
margin-bottom:8px;
}

.order p{
margin:6px 0;
}

.loading{
padding:10px 0;
color:#555;
}

.load-error{
background:#fee2e2;
color:#991b1b;
padding:12px;
border-radius:8px;
margin-top:10px;
word-break:break-word;
}
</style>
</head>

<body>

<header>
<h1>🛍️ ZavaMarket Seller Dashboard</h1>
<p>Add products and manage orders</p>
</header>

<main>

<div class="card">

<h2>➕ Add a Product</h2>

<label>Product name</label>
<input id="name" type="text" placeholder="Example: Wireless Headphones">

<label>Description</label>
<textarea id="description" placeholder="Describe your product"></textarea>

<label>Price (R)</label>
<input id="price" type="number" step="0.01" placeholder="299.00">

<label>Stock</label>
<input id="stock" type="number" placeholder="10">

<label>Category</label>
<select id="category">
<option value="Electronics">Electronics</option>
<option value="Fashion">Fashion</option>
<option value="Home">Home</option>
<option value="Beauty">Beauty</option>
</select>

<label>Product image URL</label>
<input id="image_url" type="url" placeholder="https://...">

<button type="button" onclick="addProduct()">
Add Product
</button>

<div id="message" class="message"></div>

</div>


<div class="card">

<h2>🛍️ My Products</h2>

<div id="products" class="loading">
Loading products...
</div>

</div>


<div class="card">

<h2>📦 Customer Orders</h2>

<div id="orders" class="loading">
Loading orders...
</div>

</div>


<div class="card">

<h2>Seller information</h2>

<p>
<strong>ZAVAMARKET</strong>
</p>

<p>
Seller ID:
<span id="sellerIdDisplay">Loading...</span>
</p>

<button type="button" class="back" onclick="goBack()">
← Back to ZavaMarket
</button>

</div>

</main>

<script>

const SUPABASE_URL =
"https://gaccizzlwswwynattgda.supabase.co";

const SUPABASE_KEY =
"sb_publishable_902JguVx0M5DNLWVx8trpA_LUlUMDG0";

const SELLER_ID =
localStorage.getItem("zava_seller_id");

const ACCESS_TOKEN =
localStorage.getItem("zava_access_token");


/* =========================
   CHECK LOGIN
========================= */

if(!SELLER_ID || !ACCESS_TOKEN){

  alert(
    "Seller login required. Please log in again."
  );

  window.location.href =
    "index.html";

}


/* =========================
   SHOW SELLER ID
========================= */

const sellerIdDisplay =
document.getElementById("sellerIdDisplay");

if(sellerIdDisplay){

  sellerIdDisplay.textContent =
    SELLER_ID;

}


/* =========================
   CHECK SELLER APPROVAL
========================= */

async function checkSellerApproval(){

  try{

    const response =
      await fetch(
        SUPABASE_URL +
        "/rest/v1/sellers?id=eq." +
        SELLER_ID +
        "&select=approved",
        {
          method:"GET",

          headers:{
            "apikey":SUPABASE_KEY,
            "Authorization":
              "Bearer " + ACCESS_TOKEN
          },

          cache:"no-store"
        }
      );


    if(!response.ok){

      const errorText =
        await response.text();

      alert(
        "Could not check seller approval.\n\n" +
        errorText
      );

      return false;
    }


    const sellers =
      await response.json();


    if(
      !sellers.length ||
      sellers[0].approved !== true
    ){

      document.body.innerHTML = `

        <div style="
          padding:40px 20px;
          text-align:center;
          font-family:Arial,sans-serif;
        ">

          <h1>⏳ Seller Application Pending</h1>

          <p>
            Your seller account has not been approved yet.
          </p>

          <p>
            Please wait for ZavaMarket approval before adding products.
          </p>

          <button
            onclick="window.location.href='index.html'"
            style="
              padding:12px 20px;
              border:0;
              border-radius:8px;
              background:#111827;
              color:white;
              font-size:16px;
            "
          >
            Back to ZavaMarket
          </button>

        </div>

      `;

      return false;
    }


    return true;


  }catch(error){

    alert(
      "Seller approval check failed.\n\n" +
      error.message
    );

    return false;

  }

}


/* =========================
   ADD PRODUCT
========================= */

async function addProduct(){

  const name =
    document.getElementById("name").value.trim();

  const description =
    document.getElementById("description").value.trim();

  const price =
    document.getElementById("price").value;

  const stock =
    document.getElementById("stock").value;

  const category =
    document.getElementById("category").value;

  const image_url =
    document.getElementById("image_url").value.trim();


  if(!name || !price || !stock){

    showMessage(
      "Please enter the product name, price and stock.",
      false
    );

    return;

  }


  try{

    const response =
      await fetch(
        SUPABASE_URL + "/rest/v1/products",
        {
          method:"POST",

          headers:{

            "apikey":
              SUPABASE_KEY,

            "Authorization":
              "Bearer " + ACCESS_TOKEN,

            "Content-Type":
              "application/json",

            "Prefer":
              "return=minimal"

          },

          body:
            JSON.stringify({

              seller_id:
                SELLER_ID,

              name:
                name,

              description:
                description,

              price:
                Number(price),

              stock:
                Number(stock),

              category:
                category,

              image_url:
                image_url,

              active:
                true

            })

        }
      );


    if(!response.ok){

      const errorText =
        await response.text();

      showMessage(
        "Product could not be added: " +
        errorText,
        false
      );

      return;

    }


    showMessage(
      "Product added successfully! 🎉",
      true
    );


    document.getElementById("name").value="";
    document.getElementById("description").value="";
    document.getElementById("price").value="";
    document.getElementById("stock").value="";
    document.getElementById("image_url").value="";


    loadProducts();


  }catch(error){

    console.log(error);

    showMessage(
      "Something went wrong. Please try again.",
      false
    );

  }

}


/* =========================
   MESSAGE
========================= */

function showMessage(text,success){

  const box =
    document.getElementById("message");

  box.textContent =
    text;

  box.className =
    "message " +
    (
      success
      ? "success"
      : "error"
    );

  box.style.display =
    "block";

}


/* =========================
   LOAD SELLER PRODUCTS
========================= */

async function loadProducts(){

  const productsBox =
    document.getElementById("products");


  productsBox.innerHTML =
    '<div class="loading">Loading products...</div>';


  try{

    const controller =
      new AbortController();


    const timeout =
      setTimeout(
        () => controller.abort(),
        10000
      );


    const response =
      await fetch(

        SUPABASE_URL +
        "/rest/v1/products?seller_id=eq." +
        SELLER_ID +
        "&select=id,name,description,price,stock,category,image_url,active&order=id.desc",

        {
          method:"GET",

          headers:{

            "apikey":
              SUPABASE_KEY,

            "Authorization":
              "Bearer " +
              ACCESS_TOKEN,

            "Accept":
              "application/json"

          },

          cache:"no-store",

          signal:
            controller.signal

        }

      );


    clearTimeout(timeout);


    const responseText =
      await response.text();


    if(!response.ok){

      productsBox.innerHTML =
        '<div class="load-error">' +
        "<strong>Could not load products.</strong><br><br>" +
        responseText +
        "</div>";

      return;

    }


    let products;


    try{

      products =
        JSON.parse(
          responseText
        );

    }catch(error){

      productsBox.innerHTML =
        '<div class="load-error">' +
        "<strong>Invalid response from Supabase.</strong><br><br>" +
        responseText +
        "</div>";

      return;

    }


    if(
      !Array.isArray(products) ||
      products.length === 0
    ){

      productsBox.innerHTML =
        "<p>No products yet.</p>";

      return;

    }


    productsBox.innerHTML =
      products.map(
        product => `

        <div class="product">

          ${
            product.image_url
            ?
            `<img
              src="${product.image_url}"
              onerror="this.style.display='none'"
            >`
            :
            ""
          }

          <h3>
            ${product.name}
          </h3>

          <p>
            💰 Price:
            <strong>
              R${Number(product.price).toFixed(2)}
            </strong>
          </p>

          <p>
            📦 Stock:
            ${product.stock}
          </p>

          <p>
            🏷️ Category:
            ${product.category || "Other"}
          </p>

        </div>

      `
      ).join("");


  }catch(error){

    console.log(
      "Products error:",
      error
    );


    if(
      error.name ===
      "AbortError"
    ){

      productsBox.innerHTML =
        '<div class="load-error">' +
        "<strong>Product loading timed out.</strong><br><br>" +
        "Supabase did not respond within 10 seconds." +
        "</div>";

    }else{

      productsBox.innerHTML =
        '<div class="load-error">' +
        "<strong>Product loading error:</strong><br><br>" +
        error.message +
        "</div>";

    }

  }

}


/* =========================
   LOAD ORDERS
========================= */

async function loadOrders(){

  const ordersBox =
    document.getElementById("orders");


  ordersBox.innerHTML =
    '<div class="loading">Loading orders...</div>';


  try{

    const controller =
      new AbortController();


    const timeout =
      setTimeout(
        () => controller.abort(),
        10000
      );


    const response =
      await fetch(

        SUPABASE_URL +
        "/rest/v1/orders?select=*&order=id.desc",

        {
          method:"GET",

          headers:{

            "apikey":
              SUPABASE_KEY,

            "Authorization":
              "Bearer " +
              ACCESS_TOKEN,

            "Accept":
              "application/json"

          },

          cache:"no-store",

          signal:
            controller.signal

        }

      );


    clearTimeout(timeout);


    const responseText =
      await response.text();


    if(!response.ok){

      ordersBox.innerHTML =
        '<div class="load-error">' +
        "<strong>Could not load orders.</strong><br><br>" +
        responseText +
        "</div>";

      return;

    }


    let orders;


    try{

      orders =
        JSON.parse(
          responseText
        );

    }catch(error){

      ordersBox.innerHTML =
        '<div class="load-error">' +
        "<strong>Invalid response from Supabase.</strong><br><br>" +
        responseText +
        "</div>";

      return;

    }


    if(
      !Array.isArray(orders) ||
      orders.length === 0
    ){

      ordersBox.innerHTML =
        "<p>No orders yet.</p>";

      return;

    }


    ordersBox.innerHTML =
      orders.map(
        order => `

        <div class="order">

          <strong>
            Order #${order.id}
          </strong>

          <p>
            💰 Total:
            <strong>
              R${Number(order.total).toFixed(2)}
            </strong>
          </p>

          <p>
            🏠 Delivery:
            ${
              order.delivery_address ||
              "Not provided"
            }
          </p>

          <p>
            🕐 Date:
            ${
              order.created_at
              ?
              new Date(
                order.created_at
              ).toLocaleString()
              :
              "Unknown"
            }
          </p>

          <label>
            📦 Order Status
          </label>

          <select
            id="status-${order.id}"
            onchange="updateOrderStatus(${order.id}, this.value)"
          >

            <option
              value="Pending"
              ${
                order.status === "Pending"
                ? "selected"
                : ""
              }
            >
              Pending
            </option>

            <option
              value="Processing"
              ${
                order.status === "Processing"
                ? "selected"
                : ""
              }
            >
              Processing
            </option>

            <option
              value="Shipped"
              ${
                order.status === "Shipped"
                ? "selected"
                : ""
              }
            >
              Shipped
            </option>

            <option
              value="Delivered"
              ${
                order.status === "Delivered"
                ? "selected"
                : ""
              }
            >
              Delivered
            </option>

            <option
              value="Cancelled"
              ${
                order.status === "Cancelled"
                ? "selected"
                : ""
              }
            >
              Cancelled
            </option>

          </select>

        </div>

      `
      ).join("");


  }catch(error){

    console.log(
      "Orders error:",
      error
    );


    if(
      error.name ===
      "AbortError"
    ){

      ordersBox.innerHTML =
        '<div class="load-error">' +
        "<strong>Order loading timed out.</strong><br><br>" +
        "Supabase did not respond within 10 seconds." +
        "</div>";

    }else{

      ordersBox.innerHTML =
        '<div class="load-error">' +
        "<strong>Order loading error:</strong><br><br>" +
        error.message +
        "</div>";

    }

  }

}


/* =========================
   UPDATE ORDER STATUS
========================= */

async function updateOrderStatus(
  orderId,
  newStatus
){

  const statusSelect =
    document.getElementById(
      "status-" + orderId
    );


  try{

    /* Immediately show the selected status */

    if(statusSelect){

      statusSelect.value =
        newStatus;

      statusSelect.disabled =
        true;

    }


    const response =
      await fetch(

        SUPABASE_URL +
        "/rest/v1/orders?id=eq." +
        orderId,

        {

          method:"PATCH",

          headers:{

            "apikey":
              SUPABASE_KEY,

            "Authorization":
              "Bearer " +
              ACCESS_TOKEN,

            "Content-Type":
              "application/json",

            "Prefer":
              "return=representation"

          },

          body:
            JSON.stringify({

              status:
                newStatus

            })

        }

      );


    if(!response.ok){

      const errorText =
        await response.text();


      if(statusSelect){

        statusSelect.disabled =
          false;

      }


      alert(
        "Could not update order status.\n\n" +
        errorText
      );

      return;

    }


    alert(
      "Order #" +
      orderId +
      " updated to " +
      newStatus +
      " ✅"
    );


    /* Reload orders from Supabase */

    await loadOrders();


  }catch(error){

    if(statusSelect){

      statusSelect.disabled =
        false;

    }


    alert(
      "Something went wrong while updating the order.\n\n" +
      error.message
    );

  }

}


/* =========================
   BACK TO SHOP
========================= */

function goBack(){

  window.location.href =
    "index.html";

}


/* =========================
   START
========================= */

checkSellerApproval().then(
  approved => {

    if(approved){

      loadProducts();

      loadOrders();

    }

  }
);

</script>

</body>
</html>
