<!doctype html>
<html lang="en">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>ZavaMarket Seller Dashboard</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f6f8;
  color: #222;
}

header {
  background: #111827;
  color: white;
  padding: 18px;
}

header h1 {
  margin: 0;
  font-size: 22px;
}

header p {
  margin: 5px 0 0;
  opacity: .8;
}

main {
  max-width: 700px;
  margin: 20px auto;
  padding: 15px;
}

.card {
  background: white;
  border-radius: 14px;
  padding: 20px;
  margin-bottom: 20px;
  box-shadow: 0 3px 15px rgba(0,0,0,.08);
}

h2 {
  margin-top: 0;
}

label {
  display: block;
  margin-top: 15px;
  font-weight: bold;
}

input,
textarea,
select {
  width: 100%;
  padding: 12px;
  margin-top: 7px;
  border: 1px solid #ddd;
  border-radius: 8px;
  font-size: 16px;
}

textarea {
  min-height: 100px;
  resize: vertical;
}

button {
  width: 100%;
  padding: 13px;
  margin-top: 18px;
  border: 0;
  border-radius: 8px;
  background: #111827;
  color: white;
  font-size: 16px;
  font-weight: bold;
}

button:active {
  transform: scale(.98);
}

.message {
  margin-top: 15px;
  padding: 12px;
  border-radius: 8px;
  display: none;
}

.success {
  background: #dcfce7;
  color: #166534;
}

.error {
  background: #fee2e2;
  color: #991b1b;
}

.back {
  background: #6b7280;
}

</style>

</head>

<body>

<header>

<h1>🛍️ ZavaMarket Seller Dashboard</h1>

<p>Add and manage your products</p>

</header>


<main>
