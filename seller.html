<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ZavaMarket Seller Dashboard</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f5f5f5;
    }

    .container {
      max-width: 900px;
      margin: auto;
    }

    h1 {
      text-align: center;
    }

    .card {
      background: white;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 12px;
      margin: 8px 0 15px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      padding: 12px 18px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
      margin-top: 5px;
    }

    .add-button {
      background: #111;
      color: white;
      width: 100%;
    }

    .edit-button {
      background: #e6e6e6;
      color: #111;
      margin-right: 8px;
    }

    .save-button {
      background: #111;
      color: white;
      margin-right: 8px;
    }

    .cancel-button {
      background: #ddd;
      color: #111;
    }

    .delete-button {
      background: #c62828;
      color: white;
    }

    .product {
      border-top: 1px solid #ddd;
      padding: 20px 0;
    }

    .product:first-child {
      border-top: none;
    }

    .product img {
      max-width: 180px;
      max-height: 180px;
      object-fit: cover;
      border-radius: 10px;
      display: block;
      margin-bottom: 12px;
    }

    .edit-form {
      display: none;
      margin-top: 15px;
      padding: 15px;
      background: #f7f7f7;
      border-radius: 10px;
    }

    .order {
      border-top: 1px solid #ddd;
      padding: 20px 0;
    }

    .order:first-child {
      border-top: none;
    }

    .status-select {
      width: 100%;
      margin-top: 10px;
    }

    .success {
      color: green;
      font-weight: bold;
    }

    .error {
      color: red;
      font-weight: bold;
    }

    .seller-info {
      line-height: 1.7;
    }

    .back-button {
      background: #111;
      color: white;
      width: 100%;
      margin-top: 10px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>🛍️ ZavaMarket Seller Dashboard</h1>

  <p style="text-align:center;">
    Add products and manage orders
  </p>


  <!-- ADD PRODUCT -->
  <div class="card">

    <h2>➕ Add a Product</h2>

    <label>Product name</label>

    <input
      type="text"
      id="productName"
      placeholder="Example: Wireless Headphones"
    >


    <label>Description</label>

    <textarea
      id="productDescription"
      placeholder="Describe your product"
    ></textarea>


    <label>Price (R)</label>

    <input
      type="number"
      id="productPrice"
      placeholder="299.00"
      step="0.01"
    >


    <label>Stock</label>

    <input
      type="number"
      id="productStock"
      placeholder="10"
    >


    <label>Category</label>

    <select id="productCategory">

      <option value="Electronics">
        Electronics
      </option>

      <option value="Fashion">
        Fashion
      </option>

      <option value="Home">
        Home
      </option>

      <option value="Beauty">
        Beauty
      </option>

    </select>


    <label>Product image URL</label>

    <input
      type="text"
      id="productImage"
      placeholder="https://..."
    >


    <button
      class="add-button"
      onclick="addProduct()"
    >
      Add Product
    </button>

  </div>


  <!-- MY PRODUCTS -->
  <div class="card">

    <h2>🛍️ My Products</h2>

    <div id="productsContainer">
      Loading products...
    </div>

  </div>


  <!-- CUSTOMER ORDERS -->
  <div class="card">

    <h2>📦 Customer Orders</h2>

    <div id="ordersContainer">
      Loading orders...
    </div>

  </div>


  <!-- SELLER INFORMATION -->
  <div class="card">

    <h2>Seller information</h2>

    <div class="seller-info">

      <strong>ZAVAMARKET</strong>

      <br><br>

      Seller ID: 10

      <br><br>

      <span class="success">
        ✅ ZYRE Store Subscription Active
      </span>

      <br>

      Store access active until:

      <br>

      24/10/2026

    </div>

  </div>


  <button
    class="back-button"
    onclick="goBack()"
  >
    ← Back to ZavaMarket
  </button>

</div>


<script>

const SUPABASE_URL =
  "https://gaccizzlwswwynattgda.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_902JguVx0M5DNLWVx8trpA_LUlUMDG0";

const SELLER_ID = 10;


/* =========================
   AUTH HEADERS
========================= */

function getHeaders() {

  const accessToken =
    localStorage.getItem("zava_access_token");

  return {
    "apikey": SUPABASE_KEY,
    "Authorization": "Bearer " + (
      accessToken || SUPABASE_KEY
    ),
    "Content-Type": "application/json"
  };

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(value) {

  if (
    value === null ||
    value === undefined
  ) {
    return "";
  }

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* =========================
   ADD PRODUCT
========================= */

async function addProduct() {

  const name =
    document.getElementById(
      "productName"
    ).value.trim();

  const description =
    document.getElementById(
      "productDescription"
    ).value.trim();

  const price =
    document.getElementById(
      "productPrice"
    ).value;

  const stock =
    document.getElementById(
      "productStock"
    ).value;

  const category =
    document.getElementById(
      "productCategory"
    ).value;

  const image =
    document.getElementById(
      "productImage"
    ).value.trim();


  if (!name) {

    alert(
      "Please enter a product name."
    );

    return;

  }


  if (
    price === "" ||
    Number(price) < 0
  ) {

    alert(
      "Please enter a valid price."
    );

    return;

  }


  if (
    stock === "" ||
    Number(stock) < 0
  ) {

    alert(
      "Please enter valid stock."
    );

    return;

  }


  try {

    const response =
      await fetch(

        SUPABASE_URL +
        "/rest/v1/products",

        {

          method: "POST",

          headers: {

            ...getHeaders(),

            "Prefer":
              "return=representation"

          },

          body: JSON.stringify({

            seller_id: SELLER_ID,

            name: name,

            description: description,

            price: Number(price),

            stock: Number(stock),

            category: category,

            image_url: image,

            active: true

          })

        }

      );


    if (!response.ok) {

      const error =
        await response.text();

      console.error(error);

      alert(
        "Product could not be added.\n\n" +
        error
      );

      return;

    }


    alert(
      "Product added successfully! 🎉"
    );


    document.getElementById(
      "productName"
    ).value = "";

    document.getElementById(
      "productDescription"
    ).value = "";

    document.getElementById(
      "productPrice"
    ).value = "";

    document.getElementById(
      "productStock"
    ).value = "";

    document.getElementById(
      "productImage"
    ).value = "";


    loadProducts();

  }

  catch (error) {

    console.error(error);

    alert(
      "Something went wrong while adding the product."
    );

  }

}


/* =========================
   LOAD PRODUCTS
========================= */

async function loadProducts() {

  const container =
    document.getElementById(
      "productsContainer"
    );


  container.innerHTML =
    "Loading products...";


  try {

    const response =
      await fetch(

        SUPABASE_URL +
        "/rest/v1/products?seller_id=eq." +
        SELLER_ID +
        "&select=id,name,description,price,stock,category,image_url,active&order=id.desc",

        {

          headers: getHeaders()

        }

      );


    if (!response.ok) {

      const error =
        await response.text();

      console.error(error);

      container.innerHTML =
        "<p class='error'>Unable to load products.</p>";

      return;

    }


    const products =
      await response.json();


    if (!products.length) {

      container.innerHTML =
        "<p>No products yet.</p>";

      return;

    }


    container.innerHTML = "";


    products.forEach(
      product => {

        const productDiv =
          document.createElement(
            "div"
          );


        productDiv.className =
          "product";


        productDiv.innerHTML = `

          ${
            product.image_url
              ? `
                <img
                  src="${escapeHtml(product.image_url)}"
                  alt="${escapeHtml(product.name)}"
                >
              `
              : ""
          }


          <h3>
            ${escapeHtml(product.name)}
          </h3>


          <p>
            💰 Price:
            R${Number(product.price).toFixed(2)}
          </p>


          <p>
            📦 Stock:
            ${product.stock}
          </p>


          <p>
            🏷️ Category:
            ${escapeHtml(product.category)}
          </p>


          <button
            class="edit-button"
            onclick="editProduct(${product.id})"
          >
            ✏️ Edit Product
          </button>


          <button
            class="delete-button"
            onclick="deleteProduct(
              ${product.id},
              '${escapeHtml(product.name)}'
            )"
          >
            🗑️ Delete Product
          </button>


          <div
            id="edit-${product.id}"
            class="edit-form"
          >

            <label>
              Product name
            </label>

            <input
              type="text"
              id="edit-name-${product.id}"
              value="${escapeHtml(product.name)}"
            >


            <label>
              Description
            </label>

            <textarea
              id="edit-description-${product.id}"
            >${escapeHtml(product.description || "")}</textarea>


            <label>
              Price (R)
            </label>

            <input
              type="number"
              step="0.01"
              id="edit-price-${product.id}"
              value="${product.price}"
            >


            <label>
              Stock
            </label>

            <input
              type="number"
              id="edit-stock-${product.id}"
              value="${product.stock}"
            >


            <label>
              Category
            </label>

            <select
              id="edit-category-${product.id}"
            >

              <option
                value="Electronics"
                ${
                  product.category === "Electronics"
                    ? "selected"
                    : ""
                }
              >
                Electronics
              </option>


              <option
                value="Fashion"
                ${
                  product.category === "Fashion"
                    ? "selected"
                    : ""
                }
              >
                Fashion
              </option>


              <option
                value="Home"
                ${
                  product.category === "Home"
                    ? "selected"
                    : ""
                }
              >
                Home
              </option>


              <option
                value="Beauty"
                ${
                  product.category === "Beauty"
                    ? "selected"
                    : ""
                }
              >
                Beauty
              </option>

            </select>


            <label>
              Product image URL
            </label>

            <input
              type="text"
              id="edit-image-${product.id}"
              value="${escapeHtml(product.image_url || "")}"
            >


            <br>


            <button
              class="save-button"
              onclick="saveProduct(${product.id})"
            >
              💾 Save Changes
            </button>


            <button
              class="cancel-button"
              onclick="cancelEdit(${product.id})"
            >
              Cancel
            </button>

          </div>

        `;


        container.appendChild(
          productDiv
        );

      }
    );

  }

  catch (error) {

    console.error(error);

    container.innerHTML =
      "<p class='error'>Unable to load products.</p>";

  }

}


/* =========================
   EDIT PRODUCT
========================= */

function editProduct(productId) {

  const form =
    document.getElementById(
      "edit-" + productId
    );


  if (form) {

    form.style.display =
      "block";

  }

}


/* =========================
   CANCEL EDIT
========================= */

function cancelEdit(productId) {

  const form =
    document.getElementById(
      "edit-" + productId
    );


  if (form) {

    form.style.display =
      "none";

  }

}


/* =========================
   SAVE PRODUCT
========================= */

async function saveProduct(
  productId
) {

  const name =
    document.getElementById(
      "edit-name-" + productId
    ).value.trim();

  const description =
    document.getElementById(
      "edit-description-" + productId
    ).value.trim();

  const price =
    document.getElementById(
      "edit-price-" + productId
    ).value;

  const stock =
    document.getElementById(
      "edit-stock-" + productId
    ).value;

  const category =
    document.getElementById(
      "edit-category-" + productId
    ).value;

  const image =
    document.getElementById(
      "edit-image-" + productId
    ).value.trim();


  if (!name) {

    alert(
      "Product name is required."
    );

    return;

  }


  if (
    price === "" ||
    Number(price) < 0
  ) {

    alert(
      "Please enter a valid price."
    );

    return;

  }


  if (
    stock === "" ||
    Number(stock) < 0
  ) {

    alert(
      "Please enter valid stock."
    );

    return;

  }


  try {

    const response =
      await fetch(

        SUPABASE_URL +
        "/rest/v1/products?id=eq." +
        productId +
        "&seller_id=eq." +
        SELLER_ID,

        {

          method: "PATCH",

          headers: {

            ...getHeaders(),

            "Prefer":
              "return=representation"

          },

          body: JSON.stringify({

            name: name,

            description: description,

            price: Number(price),

            stock: Number(stock),

            category: category,

            image_url: image

          })

        }

      );


    if (!response.ok) {

      const error =
        await response.text();

      console.error(error);

      alert(
        "Product could not be updated.\n\n" +
        error
      );

      return;

    }


    alert(
      "Product updated successfully! 🎉"
    );


    loadProducts();

  }

  catch (error) {

    console.error(error);

    alert(
      "Something went wrong while updating the product."
    );

  }

}


/* =========================
   DELETE PRODUCT
========================= */

async function deleteProduct(
  productId,
  productName
) {

  const confirmed =
    confirm(
      "Are you sure you want to delete \"" +
      productName +
      "\"?\n\nThis cannot be undone."
    );


  if (!confirmed) {

    return;

  }


  try {

    const response =
      await fetch(

        SUPABASE_URL +
        "/rest/v1/products?id=eq." +
        productId +
        "&seller_id=eq." +
        SELLER_ID,

        {

          method: "DELETE",

          headers: {

            ...getHeaders(),

            "Prefer":
              "return=representation"

          }

        }

      );


    if (!response.ok) {

      const error =
        await response.text();

      console.error(error);

      alert(
        "Product could not be deleted.\n\n" +
        error
      );

      return;

    }


    alert(
      "Product deleted successfully! 🗑️"
    );


    loadProducts();

  }

  catch (error) {

    console.error(error);

    alert(
      "Something went wrong while deleting the product."
    );

  }

}


/* =========================
   LOAD ORDERS
========================= */

async function loadOrders() {

  const container =
    document.getElementById(
      "ordersContainer"
    );


  container.innerHTML =
    "Loading orders...";


  try {

    const ordersResponse =
      await fetch(

        SUPABASE_URL +
        "/rest/v1/orders?select=*&order=id.desc",

        {

          headers: getHeaders()

        }

      );


    if (!ordersResponse.ok) {

      const error =
        await ordersResponse.text();

      console.error(error);

      container.innerHTML =
        "<p class='error'>Unable to load orders.</p>";

      return;

    }


    const orders =
      await ordersResponse.json();


    const productsResponse =
      await fetch(

        SUPABASE_URL +
        "/rest/v1/products?seller_id=eq." +
        SELLER_ID +
        "&select=id,name",

        {

          headers: getHeaders()

        }

      );


    if (!productsResponse.ok) {

      const error =
        await productsResponse.text();

      console.error(error);

      container.innerHTML =
        "<p class='error'>Unable to load seller products.</p>";

      return;

    }


    const sellerProducts =
      await productsResponse.json();


    const sellerProductIds =
      sellerProducts.map(
        product => Number(product.id)
      );


    const orderItemsResponse =
      await fetch(

        SUPABASE_URL +
        "/rest/v1/order_items?select=*",

        {

          headers: getHeaders()

        }

      );


    if (!orderItemsResponse.ok) {

      const error =
        await orderItemsResponse.text();

      console.error(error);

      container.innerHTML =
        "<p class='error'>Unable to load order items.</p>";

      return;

    }


    const orderItems =
      await orderItemsResponse.json();


    /*
      IMPORTANT:
      Only keep orders that contain
      at least one product belonging
      to this seller.
    */

    const sellerOrders =
      orders.filter(order => {

        return orderItems.some(item => {

          return (
            Number(item.order_id) ===
              Number(order.id)

            &&

            sellerProductIds.includes(
              Number(item.product_id)
            )
          );

        });

      });


    if (!sellerOrders.length) {

      container.innerHTML =
        "<p>No customer orders for your products yet.</p>";

      return;

    }


    container.innerHTML = "";


    sellerOrders.forEach(
      order => {

        const items =
          orderItems.filter(

            item =>

              Number(item.order_id) ===
              Number(order.id)

              &&

              sellerProductIds.includes(
                Number(item.product_id)
              )

          );


        const orderDiv =
          document.createElement(
            "div"
          );


        orderDiv.className =
          "order";


        let productHTML = "";


        items.forEach(
          item => {

            const product =
              sellerProducts.find(

                p =>
                  Number(p.id) ===
                  Number(item.product_id)

              );


            productHTML += `

              <p>
                🛍️ Product:
                <strong>
                  ${
                    product
                      ? escapeHtml(product.name)
                      : "Unknown product"
                  }
                </strong>
              </p>


              <p>
                🔢 Quantity:
                ${item.quantity}
              </p>


              <p>
                💰 Price:
                R${Number(item.price).toFixed(2)}
              </p>

            `;

          }
        );


        orderDiv.innerHTML = `

          <h3>
            Order #${order.id}
          </h3>


          ${productHTML}


          <p>
            💰 Total:
            <strong>
              R${Number(order.total).toFixed(2)}
            </strong>
          </p>


          <p>
            🏠 Delivery:
            ${escapeHtml(
              order.delivery_address || ""
            )}
          </p>


          <p>
            🕐 Date:
            ${
              order.created_at
                ? new Date(
                    order.created_at
                  ).toLocaleString()
                : ""
            }
          </p>


          <label>
            📦 Order Status
          </label>


          <select
            class="status-select"
            onchange="updateOrderStatus(
              ${order.id},
              this.value
            )"
          >

            <option
              value="Pending"
              ${
                order.status === "Pending"
                  ? "selected"
                  : ""
              }
            >
              Pending
            </option>


            <option
              value="Processing"
              ${
                order.status === "Processing"
                  ? "selected"
                  : ""
              }
            >
              Processing
            </option>


            <option
              value="Shipped"
              ${
                order.status === "Shipped"
                  ? "selected"
                  : ""
              }
            >
              Shipped
            </option>


            <option
              value="Delivered"
              ${
                order.status === "Delivered"
                  ? "selected"
                  : ""
              }
            >
              Delivered
            </option>

          </select>

        `;


        container.appendChild(
          orderDiv
        );

      }
    );

  }

  catch (error) {

    console.error(error);

    container.innerHTML =
      "<p class='error'>Unable to load orders.</p>";

  }

}


/* =========================
   UPDATE ORDER STATUS
========================= */

async function updateOrderStatus(
  orderId,
  newStatus
) {

  try {

    const response =
      await fetch(

        SUPABASE_URL +
        "/rest/v1/orders?id=eq." +
        orderId,

        {

          method: "PATCH",

          headers: {

            ...getHeaders(),

            "Prefer":
              "return=representation"

          },

          body: JSON.stringify({

            status: newStatus

          })

        }

      );


    if (!response.ok) {

      const error =
        await response.text();

      console.error(error);

      alert(
        "Order status could not be updated.\n\n" +
        error
      );

      return;

    }


    alert(
      "Order status updated successfully! ✅"
    );


    loadOrders();

  }

  catch (error) {

    console.error(error);

    alert(
      "Something went wrong while updating the order."
    );

  }

}


/* =========================
   BACK TO STORE
========================= */

function goBack() {

  window.location.href =
    "index.html";

}


/* =========================
   START
========================= */

loadProducts();

loadOrders();

</script>

</body>
</html>
