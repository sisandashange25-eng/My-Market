<!doctype html>
<html lang="en">

<head>

<meta charset="utf-8">

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>ZYRE Marketing — Store</title>

<meta
  name="description"
  content="Shop this store on ZYRE Marketing."
>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #050505;
  color: #fff;
}

/* HEADER */

.store-header {
  background: #050505;
  border-bottom: 1px solid #2b2b2b;
  padding: 22px 18px;
  text-align: center;
}

.brand {
  display: flex;
  flex-direction: column;
  align-items: center;
  line-height: 1;
}

.brand-main {
  font-size: 32px;
  font-weight: 900;
  letter-spacing: 8px;
  color: #d4af37;
}

.brand-sub {
  font-size: 10px;
  letter-spacing: 5px;
  color: #aaa;
  margin-top: 6px;
}

/* CART */

.cart-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin-top: 18px;
  padding: 11px 18px;
  border: 1px solid #d4af37;
  border-radius: 6px;
  background: #d4af37;
  color: #000;
  font-size: 14px;
  font-weight: bold;
  cursor: pointer;
}

.cart-button:hover {
  background: #f0cf62;
}

.cart-count {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 22px;
  height: 22px;
  padding: 0 6px;
  border-radius: 50%;
  background: #000;
  color: #d4af37;
  font-size: 12px;
}

/* BACK BUTTON */

.back-button {
  display: inline-block;
  margin: 20px;
  padding: 11px 18px;
  border: 1px solid #d4af37;
  border-radius: 6px;
  color: #d4af37;
  text-decoration: none;
  font-size: 14px;
  font-weight: bold;
}

.back-button:hover {
  background: #d4af37;
  color: #000;
}

/* STORE HERO */

.store-hero {
  max-width: 1100px;
  margin: 20px auto 35px;
  padding: 45px 25px;
  text-align: center;
  background:
    radial-gradient(
      circle at center,
      #25200f 0%,
      #0d0d0d 45%,
      #050505 100%
    );
  border: 1px solid #292929;
  border-radius: 14px;
}

.store-label {
  color: #d4af37;
  font-size: 12px;
  font-weight: bold;
  letter-spacing: 3px;
  text-transform: uppercase;
}

.store-name {
  margin: 12px 0;
  font-size: 42px;
  letter-spacing: 2px;
}

.store-description {
  max-width: 650px;
  margin: auto;
  color: #aaa;
  line-height: 1.6;
}

/* PRODUCTS */

.products-section {
  max-width: 1100px;
  margin: auto;
  padding: 0 20px 50px;
}

.section-title {
  margin-bottom: 22px;
}

.section-title p {
  margin: 0 0 5px;
  color: #d4af37;
  font-size: 11px;
  font-weight: bold;
  letter-spacing: 3px;
}

.section-title h2 {
  margin: 0;
  font-size: 28px;
}

/* SEARCH */

.store-tools {
  display: grid;
  grid-template-columns: 1fr 220px;
  gap: 12px;
  margin-bottom: 25px;
}

.store-search,
.category-filter {
  width: 100%;
  padding: 14px 15px;
  border: 1px solid #333;
  border-radius: 7px;
  background: #101010;
  color: #fff;
  font-size: 14px;
  outline: none;
}

.store-search:focus,
.category-filter:focus {
  border-color: #d4af37;
}

.category-filter option {
  background: #101010;
  color: #fff;
}

/* PRODUCTS GRID */

.products-grid {
  display: grid;
  grid-template-columns:
    repeat(auto-fit, minmax(230px, 1fr));
  gap: 20px;
}

/* PRODUCT CARD */

.product-card {
  overflow: hidden;
  background: #101010;
  border: 1px solid #292929;
  border-radius: 12px;
  transition: .2s ease;
}

.product-card:hover {
  transform: translateY(-3px);
  border-color: #d4af37;
}

.product-image {
  width: 100%;
  height: 230px;
  background: #181818;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.product-image img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.product-placeholder {
  font-size: 55px;
}

.product-info {
  padding: 18px;
}

.product-name {
  margin: 0 0 8px;
  font-size: 19px;
}

.product-description {
  min-height: 40px;
  margin: 0 0 12px;
  color: #999;
  font-size: 14px;
  line-height: 1.4;
}

.product-price {
  margin-bottom: 7px;
  color: #d4af37;
  font-size: 21px;
  font-weight: bold;
}

.product-stock {
  margin-bottom: 15px;
  color: #aaa;
  font-size: 13px;
}

/* ADD TO CART */

.add-cart-button {
  width: 100%;
  padding: 13px;
  border: 0;
  border-radius: 6px;
  background: #d4af37;
  color: #000;
  font-size: 14px;
  font-weight: bold;
  cursor: pointer;
}

.add-cart-button:hover {
  background: #f0cf62;
}

.add-cart-button:disabled {
  background: #444;
  color: #999;
  cursor: not-allowed;
}

/* MESSAGE */

.message {
  padding: 30px;
  text-align: center;
  color: #aaa;
  background: #101010;
  border: 1px solid #292929;
  border-radius: 10px;
}

.no-results {
  grid-column: 1 / -1;
  padding: 35px;
  text-align: center;
  color: #aaa;
  background: #101010;
  border: 1px solid #292929;
  border-radius: 10px;
}

/* FOOTER */

footer {
  padding: 35px 20px;
  border-top: 1px solid #292929;
  text-align: center;
  color: #888;
}

.footer-brand {
  color: #d4af37;
  font-size: 20px;
  font-weight: bold;
  letter-spacing: 3px;
}

.footer-text {
  margin-top: 8px;
  color: #777;
  font-size: 13px;
  letter-spacing: 1px;
}

/* MOBILE */

@media (max-width: 600px) {

  .store-name {
    font-size: 31px;
  }

  .store-hero {
    margin: 10px;
    padding: 35px 18px;
  }

  .products-section {
    padding-left: 15px;
    padding-right: 15px;
  }

  .product-image {
    height: 210px;
  }

  .store-tools {
    grid-template-columns: 1fr;
  }

}

</style>

</head>

<body>

<header class="store-header">

  <div class="brand">

    <span class="brand-main">
      ZYRE
    </span>

    <span class="brand-sub">
      MARKETING
    </span>

  </div>

  <button
    class="cart-button"
    type="button"
    onclick="openCart()"
  >
    🛒 View Cart

    <span
      id="cartCount"
      class="cart-count"
    >0</span>

  </button>

</header>

<a
  href="index.html"
  class="back-button"
>
  ← Back to Marketplace
</a>

<section class="store-hero">

  <div class="store-label">
    ZYRE MARKETPLACE
  </div>

  <h1
    id="storeName"
    class="store-name"
  >
    Loading store...
  </h1>

  <p
    id="storeDescription"
    class="store-description"
  >
    Please wait...
  </p>

</section>

<section class="products-section">

  <div class="section-title">

    <p>
      SHOP THIS STORE
    </p>

    <h2>
      Products
    </h2>

  </div>

  <!-- STORE SEARCH -->

  <div class="store-tools">

    <input
      id="storeSearch"
      class="store-search"
      type="search"
      placeholder="🔎 Search products in this store..."
      autocomplete="off"
    >

    <select
      id="categoryFilter"
      class="category-filter"
    >

      <option value="">
        All Categories
      </option>

    </select>

  </div>

  <div
    id="productsGrid"
    class="products-grid"
  >

    <div class="message">
      Loading products...
    </div>

  </div>

</section>

<footer>

  <div class="footer-brand">
    ZYRE MARKETING
  </div>

  <div class="footer-text">
    Your business. Your store. One marketplace.
  </div>

  <div class="footer-text">
    © 2026 ZYRE Marketing · Durban, South Africa
  </div>

</footer>

<script>

const SUPABASE_URL =
  "https://gaccizzlwswwynattgda.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_902JguVx0M5DNLWVx8trpA_LUlUMDG0";

const params =
  new URLSearchParams(
    window.location.search
  );

const sellerId =
  params.get("seller_id");

window.storeProducts = [];


function escapeText(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


function updateCartCount() {

  const cart =
    JSON.parse(
      localStorage.getItem("cart") || "[]"
    );

  const cartCount =
    document.getElementById("cartCount");

  if (cartCount) {

    cartCount.textContent =
      cart.length;

  }

}


function openCart() {

  window.location.href =
    "index.html#cart";

}


function addStoreProduct(productId) {

  let cart =
    JSON.parse(
      localStorage.getItem("cart") || "[]"
    );

  const product =
    window.storeProducts.find(
      product =>
        String(product.id) ===
        String(productId)
    );

  if (!product) {

    alert(
      "Product could not be found."
    );

    return;

  }

  const currentQuantity =
    cart.filter(
      id =>
        String(id) ===
        String(product.id)
    ).length;

  if (
    Number(product.stock) <=
    currentQuantity
  ) {

    alert(
      "Sorry, there is not enough stock available."
    );

    return;

  }

  cart.push(product.id);

  localStorage.setItem(
    "cart",
    JSON.stringify(cart)
  );

  updateCartCount();

  alert(
    product.name +
    " added to your cart."
  );

}


function setupCategories() {

  const categoryFilter =
    document.getElementById(
      "categoryFilter"
    );

  if (!categoryFilter) {
    return;
  }

  const categories =
    [
      ...new Set(
        window.storeProducts
          .map(product =>
            String(
              product.category || ""
            ).trim()
          )
          .filter(Boolean)
      )
    ]
    .sort();

  categoryFilter.innerHTML =
    `
      <option value="">
        All Categories
      </option>
    `;

  categories.forEach(function(category) {

    const option =
      document.createElement("option");

    option.value = category;
    option.textContent = category;

    categoryFilter.appendChild(option);

  });

}


function renderProducts() {

  const productsBox =
    document.getElementById(
      "productsGrid"
    );

  const searchBox =
    document.getElementById(
      "storeSearch"
    );

  const categoryFilter =
    document.getElementById(
      "categoryFilter"
    );

  if (!productsBox) {
    return;
  }

  const search =
    String(
      searchBox?.value || ""
    )
    .trim()
    .toLowerCase();

  const category =
    String(
      categoryFilter?.value || ""
    );

  const filteredProducts =
    window.storeProducts.filter(
      function(product) {

        const name =
          String(
            product.name || ""
          ).toLowerCase();

        const description =
          String(
            product.description || ""
          ).toLowerCase();

        const productCategory =
          String(
            product.category || ""
          );

        const matchesSearch =
          !search ||
          name.includes(search) ||
          description.includes(search);

        const matchesCategory =
          !category ||
          productCategory === category;

        return (
          matchesSearch &&
          matchesCategory
        );

      }
    );

  if (!filteredProducts.length) {

    productsBox.innerHTML =
      `
        <div class="no-results">

          🔎 No products found.

          <br><br>

          Try another search or category.

        </div>
      `;

    return;

  }

  productsBox.innerHTML =
    filteredProducts
      .map(function(product) {

        const stock =
          Number(
            product.stock || 0
          );

        const image =
          product.image_url ||
          "";

        return `

          <article class="product-card">

            <div class="product-image">

              ${
                image

                ?

                `
                  <img
                    src="${escapeText(image)}"
                    alt="${escapeText(product.name)}"
                  >
                `

                :

                `
                  <div class="product-placeholder">
                    🛍️
                  </div>
                `
              }

            </div>

            <div class="product-info">

              <h3 class="product-name">
                ${escapeText(product.name)}
              </h3>

              <p class="product-description">
                ${
                  escapeText(
                    product.description ||
                    "Quality product from this store."
                  )
                }
              </p>

              <div class="product-price">
                R${Number(
                  product.price || 0
                ).toFixed(2)}
              </div>

              <div class="product-stock">

                ${
                  stock > 0
                  ? stock + " in stock"
                  : "Out of stock"
                }

              </div>

              <button
                class="add-cart-button"
                type="button"
                data-product-id="${escapeText(product.id)}"
                ${
                  stock <= 0
                    ? "disabled"
                    : ""
                }
              >
                ${
                  stock > 0
                    ? "Add to Cart"
                    : "Out of Stock"
                }
              </button>

            </div>

          </article>

        `;

      })
      .join("");

  const buttons =
    productsBox.querySelectorAll(
      ".add-cart-button"
    );

  buttons.forEach(function(button) {

    button.addEventListener(
      "click",
      function() {

        addStoreProduct(
          button.dataset.productId
        );

      }
    );

  });

}


async function loadStore() {

  const nameBox =
    document.getElementById(
      "storeName"
    );

  const descriptionBox =
    document.getElementById(
      "storeDescription"
    );

  const productsBox =
    document.getElementById(
      "productsGrid"
    );

  if (!sellerId) {

    nameBox.textContent =
      "Store not found";

    descriptionBox.textContent =
      "No store was selected.";

    productsBox.innerHTML =
      `
        <div class="message">
          Please return to the marketplace
          and select a store.
        </div>
      `;

    return;

  }

  try {

    const sellerResponse =
      await fetch(

        SUPABASE_URL +
        "/rest/v1/sellers" +
        "?id=eq." +
        encodeURIComponent(sellerId) +
        "&select=id,store_name,description",

        {
          headers: {
            "apikey":
              SUPABASE_KEY,

            "Authorization":
              "Bearer " +
              SUPABASE_KEY
          }
        }

      );

    if (!sellerResponse.ok) {

      throw new Error(
        await sellerResponse.text()
      );

    }

    const sellers =
      await sellerResponse.json();

    if (!sellers.length) {

      throw new Error(
        "Store could not be found."
      );

    }

    const seller =
      sellers[0];

    nameBox.textContent =
      seller.store_name ||
      "ZYRE Store";

    descriptionBox.textContent =
      seller.description ||
      "Quality products from this store.";

    const productsResponse =
      await fetch(

        SUPABASE_URL +
        "/rest/v1/products" +
        "?seller_id=eq." +
        encodeURIComponent(sellerId) +
        "&active=eq.true" +
        "&select=*" +
        "&order=id.desc",

        {
          headers: {
            "apikey":
              SUPABASE_KEY,

            "Authorization":
              "Bearer " +
              SUPABASE_KEY
          }
        }

      );

    if (!productsResponse.ok) {

      throw new Error(
        await productsResponse.text()
      );

    }

    const loadedProducts =
      await productsResponse.json();

    window.storeProducts =
      loadedProducts;

    setupCategories();

    if (!loadedProducts.length) {

      productsBox.innerHTML =
        `
          <div class="message">
            This store has no products yet.
          </div>
        `;

      return;

    }

    renderProducts();

  } catch (error) {

    console.error(error);

    nameBox.textContent =
      "Store";

    descriptionBox.textContent =
      "Unable to load this store.";

    productsBox.innerHTML =
      `
        <div class="message">

          Store could not be loaded.

          <br><br>

          ${escapeText(error.message)}

        </div>
      `;

  }

}


/* SEARCH */

document
  .getElementById("storeSearch")
  ?.addEventListener(
    "input",
    renderProducts
  );


/* CATEGORY FILTER */

document
  .getElementById("categoryFilter")
  ?.addEventListener(
    "change",
    renderProducts
  );


updateCartCount();

loadStore();

</script>

</body>

</html>
