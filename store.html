<!doctype html>
<html lang="en">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >

  <title>Store — ZYRE Marketing</title>

  <link rel="stylesheet" href="style.css">

  <style>

    /* =====================================================
       STORE PAGE
       ===================================================== */

    .store-topbar {
      padding: 55px 6% 25px;

      background:
        linear-gradient(
          135deg,
          #151515,
          #080808
        );

      border-bottom: 1px solid #292929;
    }

    .store-back {
      display: inline-flex;
      align-items: center;

      min-height: 40px;

      padding: 0 16px;

      color: #d4af37;

      background: transparent;

      border: 1px solid #3b3219;
      border-radius: 3px;

      font-size: 13px;
      font-weight: 600;

      text-decoration: none;

      transition: 0.2s;
    }

    .store-back:hover {
      color: #050505;

      background: #d4af37;

      border-color: #d4af37;
    }

    .store-header {
      max-width: 900px;

      margin-top: 35px;
    }

    .store-icon {
      width: 65px;
      height: 65px;

      display: flex;
      align-items: center;
      justify-content: center;

      margin-bottom: 20px;

      color: #d4af37;

      background: #111111;

      border: 1px solid #3b3219;
      border-radius: 50%;

      font-size: 27px;

      box-shadow:
        0 0 35px rgba(212,175,55,0.06);
    }

    .store-header h1 {
      color: #ffffff;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size: clamp(42px, 7vw, 72px);

      font-weight: 500;

      line-height: 1;

      letter-spacing: -1px;
    }

    .store-description {
      max-width: 650px;

      margin-top: 18px;

      color: #888888;

      font-size: 15px;

      line-height: 1.8;
    }

    .store-line {
      width: 80px;
      height: 2px;

      margin-top: 25px;

      background: #d4af37;
    }

    .store-products-section {
      padding: 70px 6% 100px;

      background: #080808;
    }

    .store-products-heading {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;

      gap: 20px;

      margin-bottom: 35px;
    }

    .store-products-heading h2 {
      margin-top: 5px;

      color: #ffffff;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size: 35px;

      font-weight: 500;
    }

    .store-product-grid {
      display: grid;

      grid-template-columns:
        repeat(
          auto-fit,
          minmax(220px, 1fr)
        );

      gap: 22px;
    }

    .store-product {
      overflow: hidden;

      background:
        linear-gradient(
          145deg,
          #171717,
          #0d0d0d
        );

      border: 1px solid #272727;
      border-radius: 6px;

      transition:
        transform 0.25s,
        border-color 0.25s,
        box-shadow 0.25s;
    }

    .store-product:hover {
      transform: translateY(-5px);

      border-color:
        rgba(212,175,55,0.5);

      box-shadow:
        0 18px 45px rgba(0,0,0,0.35);
    }

    .store-product-image {
      width: 100%;
      height: 235px;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;

      background: #050505;
    }

    .store-product-image img {
      width: 100%;
      height: 100%;

      object-fit: cover;

      display: block;

      transition: transform 0.4s;
    }

    .store-product:hover
    .store-product-image img {
      transform: scale(1.05);
    }

    .store-product-placeholder {
      color: #d4af37;

      font-size: 55px;
    }

    .store-product-info {
      padding: 22px;
    }

    .store-product-info h3 {
      color: #ffffff;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size: 21px;

      font-weight: 500;

      line-height: 1.25;
    }

    .store-product-description {
      min-height: 42px;

      margin-top: 8px;

      color: #777777;

      font-size: 13px;

      line-height: 1.6;
    }

    .store-product-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 10px;

      margin-top: 18px;
    }

    .store-product-price {
      color: #d4af37;

      font-size: 20px;

      font-weight: 700;
    }

    .store-product-stock {
      color: #666666;

      font-size: 11px;
    }

    .store-add-button {
      width: 100%;

      min-height: 44px;

      margin-top: 18px;

      color: #050505;

      background:
        linear-gradient(
          135deg,
          #f0d477,
          #d4af37,
          #a67c00
        );

      border: none;
      border-radius: 3px;

      font-weight: 700;

      transition:
        transform 0.2s,
        box-shadow 0.2s;
    }

    .store-add-button:hover {
      transform: translateY(-2px);

      box-shadow:
        0 8px 25px rgba(212,175,55,0.2);
    }

    .store-add-button:disabled {
      color: #777777;

      background: #252525;

      cursor: not-allowed;

      box-shadow: none;

      transform: none;
    }

    .store-message {
      padding: 45px;

      text-align: center;

      color: #777777;

      background: #111111;

      border: 1px solid #252525;
      border-radius: 5px;
    }

    /* =====================================================
       MOBILE
       ===================================================== */

    @media (max-width: 700px) {

      .store-topbar {
        padding: 35px 20px 25px;
      }

      .store-header {
        margin-top: 28px;
      }

      .store-header h1 {
        font-size: 45px;
      }

      .store-description {
        font-size: 14px;
      }

      .store-products-section {
        padding: 55px 20px 75px;
      }

      .store-products-heading {
        align-items: flex-start;

        flex-direction: column;
      }

      .store-products-heading h2 {
        font-size: 30px;
      }

      .store-product-grid {
        grid-template-columns:
          repeat(
            2,
            minmax(0, 1fr)
          );

        gap: 12px;
      }

      .store-product-image {
        height: 165px;
      }

      .store-product-info {
        padding: 15px;
      }

      .store-product-info h3 {
        font-size: 17px;
      }

      .store-product-description {
        min-height: auto;

        font-size: 12px;
      }

      .store-product-bottom {
        align-items: flex-start;

        flex-direction: column;
      }

      .store-product-price {
        font-size: 18px;
      }

      .store-add-button {
        font-size: 12px;
      }

    }

    @media (max-width: 400px) {

      .store-product-grid {
        grid-template-columns: 1fr;
      }

      .store-product-image {
        height: 210px;
      }

    }

  </style>

</head>


<body>


  <!-- =====================================================
       HEADER
       ===================================================== -->

  <header class="zyre-header">

    <div class="brand">

      <span class="brand-main">
        ZYRE
      </span>

      <span class="brand-sub">
        MARKETING
      </span>

    </div>


    <div style="margin-left:auto;">

      <button
        class="cart-button"
        onclick="goHome()"
        type="button"
      >
        ← Marketplace
      </button>

    </div>

  </header>


  <!-- =====================================================
       STORE HEADER
       ===================================================== -->

  <section class="store-topbar">

    <a
      href="index.html"
      class="store-back"
    >
      ← Back to Marketplace
    </a>


    <div
      id="storeInfo"
      class="store-header"
    >

      <p class="eyebrow">
        ZYRE MARKETPLACE
      </p>

      <div class="store-icon">
        🏪
      </div>

      <h1>
        Loading store...
      </h1>

      <p class="store-description">
        Please wait while we load this store.
      </p>

    </div>

  </section>


  <!-- =====================================================
       PRODUCTS
       ===================================================== -->

  <section class="store-products-section">

    <div class="store-products-heading">

      <div>

        <p class="eyebrow">
          SHOP THIS STORE
        </p>

        <h2>
          Products
        </h2>

      </div>

    </div>


    <div
      id="storeProducts"
      class="store-product-grid"
    >

      <div class="store-message">
        Loading products...
      </div>

    </div>

  </section>


  <!-- =====================================================
       FOOTER
       ===================================================== -->

  <footer class="zyre-footer">

    <div class="footer-brand">

      <strong>
        ZYRE
      </strong>

      <span>
        MARKETING
      </span>

      <p>
        Your business. Your store. One marketplace.
      </p>

    </div>


    <div class="footer-links">

      <button
        onclick="goHome()"
        type="button"
      >
        Marketplace
      </button>

      <button
        onclick="goHome()"
        type="button"
      >
        Seller Centre
      </button>

      <button
        onclick="window.location.href='orders.html'"
        type="button"
      >
        My Orders
      </button>

    </div>


    <div class="footer-bottom">

      © 2026 ZYRE Marketing
      <br>
      Durban, South Africa

    </div>

  </footer>


  <!-- =====================================================
       SUPABASE
       ===================================================== -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <script>

    const SUPABASE_URL =
      "https://gaccizzlwswwynattgda.supabase.co";


    const SUPABASE_KEY =
      "sb_publishable_902JguVx0M5DNLWVx8trpA_LUlUMDG0";


    const params =
      new URLSearchParams(
        window.location.search
      );


    const sellerId =
      params.get("seller_id");


    function goHome() {

      window.location.href =
        "index.html";

    }


    function escapeText(value) {

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    /* =====================================================
       ADD TO CART
       ===================================================== */

    function addStoreProduct(product) {

      let cart =
        JSON.parse(
          localStorage.getItem("cart") ||
          "[]"
        );


      const existing =
        cart.find(function(item) {

          return String(item.id) ===
            String(product.id);

        });


      if (existing) {

        if (
          existing.quantity <
          Number(product.stock || 0)
        ) {

          existing.quantity++;

        } else {

          alert(
            "You cannot add more than the available stock."
          );

          return;

        }

      } else {

        cart.push({

          id: product.id,

          name:
            product.name,

          price:
            Number(product.price || 0),

          stock:
            Number(product.stock || 0),

          quantity: 1,

          image_url:
            product.image_url || "",

          seller_id:
            product.seller_id

        });

      }


      localStorage.setItem(
        "cart",
        JSON.stringify(cart)
      );


      alert(
        product.name +
        " added to your cart."
      );

    }


    /* =====================================================
       LOAD STORE
       ===================================================== */

    async function loadStore() {

      const info =
        document.getElementById(
          "storeInfo"
        );


      const products =
        document.getElementById(
          "storeProducts"
        );


      if (!sellerId) {

        info.innerHTML = `

          <p class="eyebrow">
            ZYRE MARKETPLACE
          </p>

          <h1>
            Store not found
          </h1>

          <p class="store-description">
            No store was selected.
          </p>

        `;

        products.innerHTML = "";

        return;

      }


      try {

        /* -----------------------------------------------
           LOAD SELLER
           ----------------------------------------------- */

        const sellerResponse =
          await fetch(

            SUPABASE_URL +
            "/rest/v1/sellers?id=eq." +
            encodeURIComponent(
              sellerId
            ) +
            "&select=id,store_name,description",

            {

              headers: {

                "apikey":
                  SUPABASE_KEY,

                "Authorization":
                  "Bearer " +
                  SUPABASE_KEY

              }

            }

          );


        if (!sellerResponse.ok) {

          throw new Error(
            "Could not load store"
          );

        }


        const sellers =
          await sellerResponse.json();


        if (!sellers.length) {

          info.innerHTML = `

            <p class="eyebrow">
              ZYRE MARKETPLACE
            </p>

            <h1>
              Store not found
            </h1>

          `;

          products.innerHTML = "";

          return;

        }


        const seller =
          sellers[0];


        const storeName =
          seller.store_name ||
          "ZYRE Store";


        const description =
          seller.description ||
          "Discover products from this store.";


        info.innerHTML = `

          <p class="eyebrow">
            ZYRE MARKETPLACE
          </p>

          <div class="store-icon">
            🏪
          </div>

          <h1>
            ${escapeText(
              storeName
            )}
          </h1>

          <p class="store-description">
            ${escapeText(
              description
            )}
          </p>

          <div class="store-line"></div>

        `;


        /* -----------------------------------------------
           LOAD PRODUCTS
           ----------------------------------------------- */

        const productResponse =
          await fetch(

            SUPABASE_URL +
            "/rest/v1/products?seller_id=eq." +
            encodeURIComponent(
              sellerId
            ) +
            "&active=eq.true&select=*&order=id.desc",

            {

              headers: {

                "apikey":
                  SUPABASE_KEY,

                "Authorization":
                  "Bearer " +
                  SUPABASE_KEY

              }

            }

          );


        if (!productResponse.ok) {

          throw new Error(
            "Could not load products"
          );

        }


        const productList =
          await productResponse.json();


        if (!productList.length) {

          products.innerHTML = `

            <div class="store-message">

              This store has no products yet.

            </div>

          `;

          return;

        }


        products.innerHTML =
          productList.map(
            function(product) {

              const image =
                product.image_url ||
                "";


              const stock =
                Number(
                  product.stock || 0
                );


              return `

                <article
                  class="store-product"
                >

                  <div
                    class="store-product-image"
                  >

                    ${
                      image

                      ?

                      `
                        <img
                          src="${escapeText(image)}"
                          alt="${escapeText(
                            product.name ||
                            "Product"
                          )}"
                        >
                      `

                      :

                      `
                        <div
                          class="store-product-placeholder"
                        >
                          🛍️
                        </div>
                      `
                    }

                  </div>


                  <div
                    class="store-product-info"
                  >

                    <h3>
                      ${escapeText(
                        product.name ||
                        "Product"
                      )}
                    </h3>


                    <p
                      class="store-product-description"
                    >
                      ${escapeText(
                        product.description ||
                        "Quality product available from this store."
                      )}
                    </p>


                    <div
                      class="store-product-bottom"
                    >

                      <div>

                        <div
                          class="store-product-price"
                        >
                          R${Number(
                            product.price || 0
                          ).toFixed(2)}
                        </div>

                        <div
                          class="store-product-stock"
                        >
                          ${
                            stock > 0
                              ? stock +
                                " in stock"
                              : "Out of stock"
                          }
                        </div>

                      </div>

                    </div>


                    <button
                      class="store-add-button"
                      type="button"
                      ${
                        stock <= 0
                          ? "disabled"
                          : ""
                      }
                      onclick='addStoreProduct(${JSON.stringify(
                        product
                      ).replace(
                        /'/g,
                        "&#039;"
                      )})'
                    >
                      ${
                        stock > 0
                          ? "Add to Cart"
                          : "Out of Stock"
                      }
                    </button>

                  </div>

                </article>

              `;

            }
          ).join("");


      } catch (error) {

        console.error(
          "Store error:",
          error
        );


        info.innerHTML = `

          <p class="eyebrow">
            ZYRE MARKETPLACE
          </p>

          <h1>
            Store
          </h1>

          <p class="store-description">
            We could not load this store.
            Please try again.
          </p>

        `;


        products.innerHTML = `

          <div class="store-message">

            Products could not be loaded.

          </div>

        `;

      }

    }


    loadStore();

  </script>


</body>

</html>
